<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Report Review Workspace</title>
<style>
:root{--red:#cf222e;--green:#2da44e;--red-bg:rgba(255,65,65,.38);--green-bg:rgba(34,197,94,.38);--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f4f6;color:#111827}
.topbar{min-height:58px;background:#111827;color:white;display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap}.brand{font-size:15px;font-weight:800;white-space:nowrap}
.uploadForm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;margin-left:auto}.fileLabel{display:flex;align-items:center;gap:6px;background:#1f2937;padding:5px 7px;border-radius:7px}.fileLabel input{display:none}.fileBtn{background:#374151;color:#fff;border:1px solid #4b5563;border-radius:6px;padding:4px 8px;font-weight:800;cursor:pointer}.fileName{display:inline-block;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d1d5db}
button{background:var(--blue);color:white;border:0;border-radius:8px;padding:7px 11px;font-weight:700;cursor:pointer}button.secondary{background:#374151}button:disabled{opacity:.45;cursor:not-allowed}
#status{font-size:12px;color:#d1d5db;min-width:90px}.topActions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.topActions button{font-size:12px;padding:6px 9px}.modeBadge,.dirtyBadge{border-radius:999px;padding:3px 8px;font-size:11px;font-weight:800}.modeBadge{background:#dbeafe;color:#1e40af}.dirtyBadge{background:#fef3c7;color:#92400e}main{height:calc(100vh - 58px);display:grid;grid-template-columns:320px 1fr;overflow:hidden}body.sidebarCollapsed main{grid-template-columns:0 1fr}body.sidebarCollapsed aside{border-right:0}
.sidebarRail{position:fixed;left:0;top:78px;z-index:2000;display:none;writing-mode:vertical-rl;transform:rotate(180deg);padding:10px 5px;border-radius:0 10px 10px 0;background:#111827;color:#fff;border:1px solid #374151;box-shadow:0 4px 12px rgba(0,0,0,.22);font-size:11px;letter-spacing:.04em}body.sidebarCollapsed .sidebarRail{display:block}
aside{background:white;border-right:1px solid #d1d5db;overflow:hidden;display:flex;flex-direction:column}.sideHeader{display:flex;align-items:center;justify-content:space-between;gap:8px;height:36px;padding:6px 8px;border-bottom:1px solid #e5e7eb;background:#f8fafc}.sideTitle{font-size:12px;font-weight:800;color:#374151}.sideCollapse{width:26px;height:24px;padding:0;border-radius:7px;background:#e5e7eb;color:#374151}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border-bottom:1px solid #e5e7eb}.tabBtn{background:#fff;color:#374151;border:0;border-right:1px solid #e5e7eb;border-radius:0;padding:10px 6px;font-size:12px}.tabBtn.active{color:#111827;background:#f3f4f6;box-shadow:inset 0 -2px 0 var(--blue)}
.tabBody{display:none;overflow:auto;flex:1}.tabBody.active{display:block}.diffStats{padding:10px 12px;border-bottom:1px solid #e5e7eb;font-size:13px;font-weight:800}.addStat{color:var(--green)}.delStat{color:var(--red)}
#changes,#indexList,#reviewPane,#snapshotPane{overflow:auto;padding:8px}.indexItem,.change,.snapshotRow{padding:8px;margin-bottom:8px;border:1px solid #e5e7eb;border-radius:8px;cursor:pointer;background:white;font-size:12px}.indexItem:hover,.change:hover,.snapshotRow:hover{background:#f8fbff;border-color:#93c5fd}.indexItem .type{font-size:10px;color:#6b7280;font-weight:800;margin-bottom:3px}.change.active,.indexItem.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.12)}.snapshotBar{display:grid;grid-template-columns:1fr auto;gap:6px;padding:8px;border-bottom:1px solid #e5e7eb}.snapshotBar input{min-width:0;border:1px solid #d1d5db;border-radius:7px;padding:6px;font:12px system-ui}.snapshotBar button{font-size:12px}.readonlyBadge{background:#fef3c7;color:#92400e;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:800}
.meta{color:#6b7280;font-size:11px;margin-bottom:4px}.delText{background:#fee2e2;color:#991b1b;padding:1px 3px;border-radius:3px}.addText{background:#dcfce7;color:#166534;padding:1px 3px;border-radius:3px}
.viewer{display:grid;grid-template-columns:1fr 1fr;overflow:hidden}.viewer.single{grid-template-columns:1fr}.viewer.single #oldPane{display:none}.pane{position:relative;overflow:auto;background:#e5e7eb;border-right:1px solid #9ca3af}.pane:last-child{border-right:0}.paneTitle{position:sticky;top:0;z-index:20;background:rgba(17,24,39,.95);color:white;padding:7px 10px;font-size:12px;font-weight:800;display:flex;justify-content:space-between;gap:8px}.paneTitle span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pages{padding:6px;display:flex;flex-direction:column;align-items:center;gap:10px}.page{position:relative;background:white;box-shadow:0 2px 12px rgba(0,0,0,.22);flex:none}.page img{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;user-select:none;-webkit-user-drag:none}.hl{position:absolute;z-index:2;border-radius:2px;pointer-events:none;mix-blend-mode:multiply}.hl.delete{background:var(--red-bg)}.hl.add{background:var(--green-bg)}.hl.focus{outline:none!important;box-shadow:inset 0 0 0 1.5px #2563eb!important;z-index:4!important;border-radius:3px!important}
.empty{padding:20px;color:#6b7280;font-size:13px}.reviewPlaceholder{color:#6b7280;line-height:1.5;font-size:13px;padding:10px}.selbox{display:none}.textsel{position:absolute;z-index:7;background:rgba(37,99,235,.30);border-radius:2px;pointer-events:none;mix-blend-mode:multiply}.reviewAnchorFocus,.reviewAnchorHover{position:absolute;z-index:6;background:rgba(99,102,241,.16);box-shadow:inset 0 0 0 1.5px #4f46e5;border-radius:2px;pointer-events:none}.reviewAnchorHover{z-index:7;background:rgba(245,158,11,.24);box-shadow:inset 0 0 0 1.5px #d97706}
.review{position:absolute;z-index:3;background:rgba(245,158,11,.30);box-shadow:inset 0 0 0 1px rgba(180,83,9,.65);border-radius:2px;cursor:pointer}.review.cleared,.review.resolved{background:rgba(148,163,184,.28);box-shadow:inset 0 0 0 1px rgba(100,116,139,.6)}.review.active{box-shadow:inset 0 0 0 2px var(--blue);z-index:5}.review.preview{background:rgba(37,99,235,.22);box-shadow:inset 0 0 0 1px var(--blue);pointer-events:none}
.reviewNote{position:absolute;z-index:8;width:18px;height:18px;background:#fbbf24;border:1px solid #92400e;border-radius:4px;box-shadow:0 2px 4px rgba(0,0,0,.25);cursor:pointer}.reviewNote:after{content:"";position:absolute;right:-4px;bottom:2px;border-width:4px 0 0 4px;border-style:solid;border-color:transparent transparent transparent #92400e}.reviewNote.cleared,.reviewNote.resolved{background:#cbd5e1;border-color:#64748b}.reviewNote.active{outline:2px solid var(--blue)}
.reviewNotePanel{position:absolute;z-index:30;width:340px;height:220px;min-width:280px;min-height:170px;max-width:560px;max-height:520px;resize:both;overflow:hidden;background:#fffbeb;border:1px solid #d97706;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:12px;color:#111827;cursor:move;user-select:text}.reviewNotePanel.cleared,.reviewNotePanel.resolved{background:#f8fafc;border-color:#94a3b8}.noteMin{position:absolute;right:4px;top:4px;width:16px;height:16px;padding:0!important;border-radius:4px;background:#fef3c7!important;color:#92400e!important;line-height:14px;font-size:10px!important}.noteBody{padding:22px 8px 4px 8px;max-height:calc(100% - 88px);overflow:auto;cursor:text;user-select:text}.noteThread{display:flex;flex-direction:column;gap:6px}.noteComment{background:rgba(255,255,255,.72);border-left:3px solid #f59e0b;border-radius:6px;padding:6px 7px;white-space:pre-wrap;overflow-wrap:anywhere}.noteComment+.noteComment{margin-left:10px}.noteCommentMeta{margin-top:3px;color:#6b7280;font-size:10px}.noteReply{display:none;padding:4px 8px 2px 8px;cursor:default}.noteReply textarea{width:100%;height:50px;border:1px solid #d1d5db;border-radius:6px;padding:5px;font:12px system-ui;resize:vertical}.noteReplyActions{display:flex;justify-content:flex-end;gap:5px;margin-top:4px}.noteActions{display:flex;gap:6px;padding:4px 8px 7px 8px;cursor:default;user-select:none;flex-wrap:wrap}.noteActions button,.noteReplyActions button{padding:4px 7px;font-size:11px}.noteDelete{background:#fee2e2!important;color:#991b1b!important}
#reviewPopover{position:fixed;z-index:1000;width:262px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:10px;display:none}#reviewPopover textarea{width:100%;height:64px;border:1px solid #d1d5db;border-radius:7px;padding:6px;font:13px system-ui;resize:vertical}#reviewPopover .row{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}#reviewPopover button{padding:6px 10px}#reviewPopover button.cancel{background:#e5e7eb;color:#374151}
.reviewRow{padding:8px;margin-bottom:8px;border:1px solid #e5e7eb;border-radius:8px;cursor:pointer;background:#fff;font-size:12px;overflow:hidden}.reviewRow:hover{background:#fffaf0;border-color:#fcd34d}.reviewRow.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.12)}.reviewRow.cleared,.reviewRow.resolved{opacity:.6}.rvSummary{display:flex;align-items:flex-start;gap:6px;margin:3px 0}.rvSummaryText{min-width:0;flex:1;color:#111827;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.rvMoreCount{flex:none;background:#fef3c7;color:#92400e;border-radius:999px;padding:1px 6px;font-size:10px;font-weight:800}.reviewRow .rvActions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.reviewRow .rvActions button{padding:4px 8px;font-size:11px;background:#eef2ff;color:#3730a3}.rvReply{display:none;margin-top:6px}.rvReply textarea{width:100%;height:48px;border:1px solid #d1d5db;border-radius:6px;padding:5px;font:12px system-ui;resize:vertical}.rvReplyActions{display:flex;justify-content:flex-end;gap:5px;margin-top:4px}.rvReplyActions button{padding:4px 8px;font-size:11px}.aiBar{display:none;padding:8px 12px;border-bottom:1px solid #e5e7eb;gap:8px}.aiBar button{flex:1;font-size:12px;background:#7c3aed}.aiBadge{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:999px;font-size:10px;font-weight:800;background:#e5e7eb;color:#374151}.aiBadge.cleared{background:#dcfce7;color:#166534}.aiBadge.partial{background:#fef3c7;color:#92400e}.aiBadge.unclear{background:#e0e7ff;color:#3730a3}.aiBadge.not_cleared{background:#fee2e2;color:#991b1b}.aiReason{margin-top:5px;padding:6px;border-left:3px solid #a78bfa;background:#f5f3ff;color:#4c1d95;font-size:11px;line-height:1.35}
.reviewSubtabs{display:flex;border-bottom:1px solid #e5e7eb}.reviewSubtab{flex:1;border-radius:0;background:#fff;color:#374151;border-right:1px solid #e5e7eb;padding:8px;font-size:12px}.reviewSubtab.active{background:#eef2ff;color:#1d4ed8;box-shadow:inset 0 -2px 0 var(--blue)}.filterBar{display:flex;gap:5px;align-items:center;padding:7px 8px;border-bottom:1px solid #e5e7eb;background:#f8fafc;flex-wrap:wrap}.filterBar select,.filterBar button{font-size:11px;padding:4px 6px;border-radius:6px}.filterBar select{border:1px solid #cbd5e1;background:white;color:#374151;min-width:70px}.filterBar button{background:#e5e7eb;color:#374151}.confirmBackdrop{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:2500;display:none;align-items:center;justify-content:center}.confirmBox{width:310px;background:#fff;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.32);padding:14px}.confirmMsg{font-size:13px;line-height:1.45;color:#111827;margin-bottom:12px}.confirmActions{display:flex;gap:8px;justify-content:flex-end}.confirmActions button{padding:6px 12px}.confirmActions .cancel{background:#e5e7eb;color:#374151}#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 14px;border-radius:8px;font-size:12px;z-index:2000;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw}#toast.show{opacity:1}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">Report Review Workspace</div>
  <form id="createForm" class="uploadForm">
    <label class="fileLabel">Base Report <input id="initialFile" type="file" name="pdf" accept="application/pdf" required><span class="fileBtn">Select File</span><span id="initialFileName" class="fileName">No file selected</span></label>
    <button id="createBtn" type="submit">Create Workspace</button>
  </form>
  <form id="updateForm" class="uploadForm" style="display:none">
    <label class="fileLabel">Updated Report <input id="updateFile" type="file" name="pdf" accept="application/pdf" required><span class="fileBtn">Select File</span><span id="updateFileName" class="fileName">No file selected</span></label>
    <button id="updateBtn" type="submit">Compare Update</button>
  </form>
  <div class="topActions">
    <button id="topSaveSnapshotBtn" class="secondary" type="button" onclick="saveSnapshot()">Save Snapshot</button>
    <button id="backLiveBtn" class="secondary" type="button" onclick="backToLiveRun()" style="display:none">Back to Live Run</button>
    <span id="modeBadge" class="modeBadge">Live Run</span>
    <span id="dirtyBadge" class="dirtyBadge" style="display:none">Unsaved changes</span>
  </div>
  <span id="status">Idle</span>
</div>
<button id="sidebarRail" class="sidebarRail" type="button" title="Open sidebar">Open panel</button>
<main>
  <aside>
    <div class="sideHeader"><span class="sideTitle">Review Panel</span><button id="sidebarCollapseBtn" class="sideCollapse" type="button" title="Collapse sidebar">‹</button></div>
    <div class="tabs">
      <button class="tabBtn active" data-tab="index">Outline</button>
      <button class="tabBtn" data-tab="diff">Changes</button>
      <button class="tabBtn" data-tab="review">Comments</button>
      <button class="tabBtn" data-tab="snapshot">History</button>
    </div>
    <div id="tab-index" class="tabBody active"><div id="indexList"><div class="empty">Upload a report to view the outline.</div></div></div>
    <div id="tab-diff" class="tabBody"><div id="diffStats" class="diffStats"><span class="addStat">+ 0</span> / <span class="delStat">-0</span></div><div id="changes"><div class="empty">Upload an updated report to compare changes.</div></div></div>
    <div id="tab-review" class="tabBody"><div id="reviewSubtabs" class="reviewSubtabs"><button id="reviewPrevTab" class="reviewSubtab" onclick="setReviewSide('old')">Previous</button><button id="reviewCurrentTab" class="reviewSubtab active" onclick="setReviewSide('new')">Current</button></div><div id="aiBar" class="aiBar"><button id="runAiBtn" onclick="runAiAssessment()">Run AI on All</button><button id="moveOpenBtn" onclick="moveOpenPreviousReviewsToCurrent()">Forward All</button></div><div id="reviewFilterBar" class="filterBar"><select id="filterStatus" onchange="setReviewFilter('status',this.value)"><option value="all">Status</option><option value="open">Open</option><option value="cleared">Cleared</option></select><select id="filterAi" onchange="setReviewFilter('ai',this.value)"><option value="all">AI</option><option value="checked">AI Done</option><option value="unchecked">No AI</option></select><select id="filterMatch" onchange="setReviewFilter('match',this.value)"><option value="all">Match</option><option value="matched">Matched</option><option value="unmatched">Floating</option></select><select id="filterSort" onchange="setReviewFilter('sort',this.value)"><option value="default">Sort</option><option value="comments_desc">Most Comments</option><option value="comments_asc">Fewest Comments</option></select><button type="button" onclick="resetReviewFilters()">Reset</button></div><div id="exportBar" style="display:none;padding:8px 12px;border-bottom:1px solid #e5e7eb;gap:8px"><button id="exportOldBtn" onclick="exportPdf('old')" style="flex:1;font-size:12px;background:#374151">Export Previous Comments</button><button id="exportCurrentBtn" onclick="exportPdf('new')" style="flex:1;font-size:12px">Export Current Comments</button></div><div id="reviewPane"><div class="reviewPlaceholder">No comments yet.</div></div></div>
    <div id="tab-snapshot" class="tabBody"><div class="snapshotBar"><input id="snapshotLabel" placeholder="Optional snapshot label"><button onclick="saveSnapshot()">Save Snapshot</button></div><div id="snapshotPane"><div class="empty">Save a snapshot to preserve the current review state.</div></div></div>
  </aside>
  <section id="viewer" class="viewer single">
    <div id="oldPane" class="pane"><div class="paneTitle"><span id="oldTitle">Previous PDF</span><span id="oldCount"></span></div><div id="oldPages" class="pages"></div></div>
    <div id="newPane" class="pane"><div class="paneTitle"><span id="newTitle">Current PDF</span><span id="newCount"></span></div><div id="newPages" class="pages"></div></div>
  </section>
</main>
<div id="reviewPopover">
  <textarea id="pvComment" placeholder="Enter a comment"></textarea>
  <div class="row"><button class="cancel" id="pvCancel">Cancel</button><button id="pvSave">Save Comment</button></div>
</div>
<div id="confirmDialog" class="confirmBackdrop">
  <div class="confirmBox">
    <div id="confirmMsg" class="confirmMsg"></div>
    <div class="confirmActions"><button id="confirmNo" class="cancel" type="button">Cancel</button><button id="confirmYes" type="button">Yes</button></div>
  </div>
</div>
<div id="toast"></div>
<script>
let ZOOM=1.15;
const $=s=>document.querySelector(s);
let DATA=null, DOC_ID=null, RUN_ID=null, LIVE_RUN_ID=null, SNAPSHOT_ID=null, READ_ONLY=false, DIRTY=false;
let WORDS={old:[],new:[]};
let CHARS={old:[],new:[]};
let EQUAL={pairs:[],newToOld:new Map(),oldToNew:new Map(),newEqual:new Set(),oldEqual:new Set()};
let REVIEWS=[];
let AI_ASSESSMENT={items:[]};
let REVIEW_SIDE='new';
let REVIEW_FILTERS={status:'all',ai:'all',match:'all',sort:'default'};

document.querySelectorAll('.tabBtn').forEach(btn=>btn.addEventListener('click',()=>activateTab(btn.dataset.tab)));
function setSidebarCollapsed(collapsed){document.body.classList.toggle('sidebarCollapsed',collapsed);if(DATA)requestAnimationFrame(()=>draw(DATA))}
$('#sidebarCollapseBtn').addEventListener('click',()=>setSidebarCollapsed(true));
$('#sidebarRail').addEventListener('click',()=>setSidebarCollapsed(false));
window.addEventListener('resize',()=>{if(DATA)draw(DATA)});
$('#initialFile').addEventListener('change',()=>{$('#initialFileName').textContent=$('#initialFile').files[0]?.name||'No file selected'});
$('#updateFile').addEventListener('change',()=>{$('#updateFileName').textContent=$('#updateFile').files[0]?.name||'No file selected'});
function activateTab(name){document.querySelectorAll('.tabBtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.querySelectorAll('.tabBody').forEach(b=>b.classList.toggle('active',b.id===`tab-${name}`));if(name==='snapshot')loadSnapshots()}
function apiBase(){return SNAPSHOT_ID?`/api/documents/${DOC_ID}/snapshots/${SNAPSHOT_ID}`:`/api/documents/${DOC_ID}/runs/${RUN_ID}`}
function isDiff(){return DATA?.mode==='diff'}
function escapeHtml(s){return String(s||'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}
function trim(s,n=160){s=String(s||'');return s.length>n?s.slice(0,n-1)+'...':s}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800)}
function setBusy(busy,msg){$('#createBtn').disabled=busy;$('#updateBtn').disabled=busy;$('#status').textContent=msg||'Idle'}
function setDirty(value=true){DIRTY=!!value;updateModeUi()}
function updateModeUi(){const mode=$('#modeBadge'),dirty=$('#dirtyBadge'),back=$('#backLiveBtn');mode.textContent=READ_ONLY?'Snapshot View':'Live Run';mode.style.background=READ_ONLY?'#fef3c7':'#dbeafe';mode.style.color=READ_ONLY?'#92400e':'#1e40af';dirty.style.display=(!READ_ONLY&&DIRTY)?'inline-block':'none';back.style.display=READ_ONLY?'inline-block':'none'}

$('#createForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const file=$('#initialFile').files[0]; if(!file)return;
  setBusy(true,'Processing base report');
  $('#indexList').innerHTML='<div class="empty">Running OpenDataLoader and building the outline...</div>';
  $('#changes').innerHTML='<div class="empty">The base report has no comparison yet.</div>';
  const fd=new FormData(); fd.append('pdf',file); fd.append('title',file.name.replace(/\.pdf$/i,''));
  try{
    const res=await fetch('/api/documents',{method:'POST',body:fd});
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||res.status);
    DOC_ID=data.doc_id; RUN_ID=data.run_id; LIVE_RUN_ID=data.run_id; SNAPSHOT_ID=null; READ_ONLY=false; setDirty(false); DATA=data.result;
    $('#updateForm').style.display='flex';
    draw(DATA); loadSnapshots(); activateTab('review'); setBusy(false,'Base report ready');
  }catch(err){setBusy(false,'Error: '+err.message)}
});

$('#updateForm').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!DOC_ID){toast('Upload a base report first.');return}
  const file=$('#updateFile').files[0]; if(!file)return;
  setBusy(true,'Uploading updated report');
  const fd=new FormData(); fd.append('pdf',file);
  try{
    let res=await fetch(`/api/documents/${DOC_ID}/runs`,{method:'POST',body:fd});
    let data=await res.json();
    if(!res.ok)throw new Error(data.error||res.status);
    RUN_ID=data.run_id; LIVE_RUN_ID=data.run_id; SNAPSHOT_ID=null; READ_ONLY=false; setDirty(false);
    $('#status').textContent='Comparing reports';
    res=await fetch(`${apiBase()}/diff`,{method:'POST'});
    data=await res.json();
    if(!res.ok)throw new Error(data.error||res.status);
    DATA=data.result;
    draw(DATA); loadSnapshots(); activateTab('diff'); setBusy(false,'Comparison complete');
  }catch(err){setBusy(false,'Error: '+err.message)}
});

function draw(d){
  $('#viewer').classList.toggle('single',!isDiff());
  if(!isDiff())REVIEW_SIDE='new';
  updateModeUi();
  if(READ_ONLY)$('#status').innerHTML='<span class="readonlyBadge">Snapshot</span>';
  $('#oldTitle').textContent=d.old_filename||'Previous PDF';
  $('#newTitle').textContent=d.new_filename||d.filename||'Current PDF';
  const added=d.summary?.added||0, deleted=d.summary?.deleted||0;
  $('#diffStats').innerHTML=`<span class="addStat">+ ${added}</span> / <span class="delStat">-${deleted}</span>`;
  ZOOM=computeFitZoom(d);
  drawIndex(d); drawChanges(d);
  if(isDiff())drawPages('old',d.old_page_count||0,d.old_page_sizes||[],d.highlights_old||[]);
  else $('#oldPages').innerHTML='';
  drawPages('new',d.new_page_count||d.page_count||0,d.new_page_sizes||d.page_sizes||[],d.highlights_new||[]);
  $('#oldCount').textContent=isDiff()?`${(d.highlights_old||[]).length}`:'';
  $('#newCount').textContent=`${(d.highlights_new||[]).length}`;
  $('#reviewSubtabs').style.display=isDiff()?'flex':'none';
  updateReviewSubtabs();

  const w=ws[0], pg=document.getElementById(`${side}-page-${w.page}`);if(!pg)return;
  const bbox=ws.reduce((b,x)=>[Math.min(b[0],x.bbox[0]),Math.min(b[1],x.bbox[1]),Math.max(b[2],x.bbox[2]),Math.max(b[3],x.bbox[3])],ws[0].bbox.slice());
  const icon=document.createElement('div');
  icon.className='reviewNote'+(isCleared(rv)?' cleared':'');
  icon.dataset.reviewId=rv.review_id;
  icon.dataset.side=side;
  const pos=markerPositionForBbox(pg,side,w.page,bbox);
  icon.style.left=pos.x*ZOOM+'px';
  icon.style.top=pos.y*ZOOM+'px';
  icon.onmouseenter=()=>showReviewHover(rv,side);
  icon.onmouseleave=clearAnchorHover;
  icon.onclick=e=>{e.stopPropagation();toggleNotePanel(pg,rv,side,bbox)};
  pg.appendChild(icon);
}
function panelPositionForBbox(pageEl,bbox){
  const pageW=pageEl.clientWidth/ZOOM,pageH=pageEl.clientHeight/ZOOM,panelW=340/ZOOM,panelH=220/ZOOM,gap=8;
  let x;
  if(bbox[2]+gap+panelW<=pageW)x=bbox[2]+gap;
  else if(bbox[0]-gap-panelW>=0)x=bbox[0]-gap-panelW;
  else x=Math.max(2,Math.min(pageW-panelW-2,bbox[2]+gap));
  const y=Math.max(2,Math.min(pageH-panelH-2,bbox[1]));
  return {x,y};
}
function reviewComments(rv){
  const comments=(rv.comments||[]).filter(c=>(c.text||'').trim());
  if(comments.length)return comments;
  return (rv.comment||'').trim()?[{text:rv.comment,created_at:rv.created_at||''}]:[];
}
function renderNoteThread(rv){
  const comments=reviewComments(rv);
  if(!comments.length)return '<div class="noteComment">(No comment)</div>';
  return `<div class="noteThread">${comments.map(c=>`<div class="noteComment"><div>${escapeHtml(c.text||'')}</div>${c.created_at?`<div class="noteCommentMeta">${escapeHtml(String(c.created_at).slice(0,16).replace('T',' '))}</div>`:''}</div>`).join('')}</div>`;
}
function renderNotePanelHtml(rv){
  const actions=READ_ONLY?'':`<div class="noteReply"><textarea placeholder="Comment"></textarea><div class="noteReplyActions"><button type="button" data-act="saveComment">Comment</button><button type="button" data-act="cancelComment">Cancel</button></div></div><div class="noteActions"><button type="button" data-act="add">Comment</button><button type="button" data-act="toggle">${isCleared(rv)?'Reopen':'Clear'}</button><button type="button" class="noteDelete" data-act="delete">Delete</button></div>`;
  return `<button type="button" class="noteMin" data-act="min">_</button><div class="noteBody">${renderNoteThread(rv)}</div>${actions}`;
}
function toggleNotePanel(pageEl,rv,side,bbox){
  const existing=pageEl.querySelector(`.reviewNotePanel[data-review-id="${rv.review_id}"]`);
  if(existing){existing.remove();return}
  document.querySelectorAll('.reviewNotePanel').forEach(e=>e.remove());
  const pos=panelPositionForBbox(pageEl,bbox);
  const panel=document.createElement('div');
  panel.className='reviewNotePanel'+(isCleared(rv)?' cleared':'');
  panel.dataset.reviewId=rv.review_id;
  panel.style.left=pos.x*ZOOM+'px';
  panel.style.top=pos.y*ZOOM+'px';
  panel.innerHTML=renderNotePanelHtml(rv);
  panel.addEventListener('mousedown',e=>e.stopPropagation());
  panel.addEventListener('click',e=>e.stopPropagation());
  panel.querySelector('[data-act="min"]').onclick=e=>{e.stopPropagation();panel.remove()};
  if(!READ_ONLY){
    panel.querySelector('[data-act="add"]').onclick=e=>{e.stopPropagation();showNoteReply(panel)};
    panel.querySelector('[data-act="cancelComment"]').onclick=e=>{e.stopPropagation();hideNoteReply(panel)};
    panel.querySelector('[data-act="saveComment"]').onclick=e=>{e.stopPropagation();saveNoteComment(panel,rv.review_id)};
    panel.querySelector('[data-act="toggle"]').onclick=e=>{e.stopPropagation();toggleReview(rv.review_id,isCleared(rv)?'open':'cleared')};
    panel.querySelector('[data-act="delete"]').onclick=e=>{e.stopPropagation();deleteReview(rv.review_id)};
  }
  makeDraggable(panel,panel,pageEl);
  pageEl.appendChild(panel);
  focusReview(rv,side);
}
function makeDraggable(panel,handle,pageEl){
  handle.addEventListener('mousedown',e=>{
    if(e.target.closest('button,textarea,.noteBody,.noteActions,.noteReply'))return;
    e.preventDefault();
    const startX=e.clientX,startY=e.clientY,startL=parseFloat(panel.style.left)||0,startT=parseFloat(panel.style.top)||0;
    const move=ev=>{
      const maxL=Math.max(0,pageEl.clientWidth-panel.offsetWidth-2),maxT=Math.max(0,pageEl.clientHeight-panel.offsetHeight-2);
      panel.style.left=Math.max(0,Math.min(maxL,startL+(ev.clientX-startX)))+'px';
      panel.style.top=Math.max(0,Math.min(maxT,startT+(ev.clientY-startY)))+'px';
    };
    const up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up)};
    document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
  });
}
function showNoteReply(panel){const box=panel.querySelector('.noteReply'),ta=box?.querySelector('textarea');if(!box||!ta)return;box.style.display='block';ta.value='';ta.focus()}
function hideNoteReply(panel){const box=panel.querySelector('.noteReply'),ta=box?.querySelector('textarea');if(!box||!ta)return;box.style.display='none';ta.value=''}
async function saveNoteComment(panel,id){const ta=panel.querySelector('.noteReply textarea');const text=(ta?.value||'').trim();if(!text)return;try{const rv=await postComment(id,text);setDirty(true);panel.querySelector('.noteBody').innerHTML=renderNoteThread(rv);hideNoteReply(panel);renderReviewList(REVIEWS)}catch(e){toast('Failed to add comment')}}
async function postComment(id,text){
  const res=await fetch(`${apiBase()}/reviews/${id}/comments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  const updated=await res.json();
  if(!res.ok||updated.error)throw new Error(updated.error||'comment_failed');
  let merged=null;
  REVIEWS=REVIEWS.map(rv=>{
    if(rv.review_id!==id)return rv;
    const next={...rv,...updated,side:rv.side,anchor_run_id:rv.anchor_run_id,old_word_ids:rv.old_word_ids,new_word_ids:rv.new_word_ids,selection:rv.selection,floating:rv.floating};
    merged=next;
    return next;
  });
  if(merged){drawReviewMarkers(REVIEWS);return merged}
  return updated;
}
function showListReply(id){const row=document.querySelector(`.reviewRow[data-review-id="${id}"]`),box=row?.querySelector('.rvReply'),ta=box?.querySelector('textarea');if(!box||!ta)return;box.style.display='block';ta.value='';ta.focus()}
function hideListReply(id){const row=document.querySelector(`.reviewRow[data-review-id="${id}"]`),box=row?.querySelector('.rvReply'),ta=box?.querySelector('textarea');if(!box||!ta)return;box.style.display='none';ta.value=''}
function refreshOpenNotePanels(id,rv){document.querySelectorAll(`.reviewNotePanel[data-review-id="${id}"] .noteBody`).forEach(body=>{body.innerHTML=renderNoteThread(rv)})}
async function saveListComment(id){const row=document.querySelector(`.reviewRow[data-review-id="${id}"]`),ta=row?.querySelector('.rvReply textarea');const text=(ta?.value||'').trim();if(!text)return;try{const rv=await postComment(id,text);setDirty(true);refreshOpenNotePanels(id,rv);renderReviewList(REVIEWS);focusReviewById(id)}catch(e){toast('Failed to add comment')}}
function askConfirm(message){return new Promise(resolve=>{const dlg=$('#confirmDialog'),msg=$('#confirmMsg'),yes=$('#confirmYes'),no=$('#confirmNo');msg.textContent=message;dlg.style.display='flex';const done=v=>{dlg.style.display='none';yes.onclick=null;no.onclick=null;resolve(v)};yes.onclick=()=>done(true);no.onclick=()=>done(false)})}
function clearAnchorFocus(){document.querySelectorAll('.reviewAnchorFocus').forEach(e=>e.remove())}
function clearAnchorHover(){document.querySelectorAll('.reviewAnchorHover').forEach(e=>e.remove())}
function showAnchorHover(side,wordIds){clearAnchorHover();showAnchorFocus(side,wordIds,'reviewAnchorHover')}
function showAnchorFocus(side,wordIds,cls='reviewAnchorFocus'){
  if(!wordIds||!wordIds.length||!WORDS[side]?.length)return;
  const byPageLine=new Map();
  wordIds.forEach(id=>{const w=WORDS[side][id];if(!w)return;const key=`${w.page}:${w.block??0}:${w.line??Math.round(w.bbox[1])}`;if(!byPageLine.has(key))byPageLine.set(key,{page:w.page,words:[]});byPageLine.get(key).words.push(w)});
  byPageLine.forEach(group=>{
    const pg=document.getElementById(`${side}-page-${group.page}`);if(!pg)return;
    const xs=[],ys=[];group.words.forEach(w=>{const[x0,y0,x1,y1]=w.bbox;xs.push(x0,x1);ys.push(y0,y1)});
    const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
    const el=document.createElement('div');el.className=cls;
    el.style.left=x0*ZOOM+'px';el.style.top=y0*ZOOM+'px';
    el.style.width=Math.max(1,(x1-x0)*ZOOM)+'px';el.style.height=Math.max(2,(y1-y0)*ZOOM)+'px';
    pg.appendChild(el);
  });
}
function reviewBelongsToSide(rv,side){return side==='old'?((rv.old_word_ids||[]).length>0||rv.side==='old'):((rv.new_word_ids||[]).length>0||rv.side==='new')}
function reviewHasLocation(rv,side){return side==='old'?(rv.old_word_ids||[]).length>0:(rv.new_word_ids||[]).length>0}
function reviewSortRank(rv){if(isCleared(rv))return 2;return reviewHasLocation(rv,REVIEW_SIDE)?0:1}
function filteredSortedReviews(reviews){
  let out=[...(reviews||[])].filter(rv=>reviewBelongsToSide(rv,REVIEW_SIDE));
  out=out.filter(rv=>{
    const ai=aiItemForReview(rv.review_id), matched=reviewHasLocation(rv,REVIEW_SIDE);
    if(REVIEW_FILTERS.status==='open'&&isCleared(rv))return false;
    if(REVIEW_FILTERS.status==='cleared'&&!isCleared(rv))return false;
    if(REVIEW_FILTERS.ai==='checked'&&!ai)return false;
    if(REVIEW_FILTERS.ai==='unchecked'&&ai)return false;
    if(REVIEW_FILTERS.match==='matched'&&!matched)return false;
    if(REVIEW_FILTERS.match==='unmatched'&&matched)return false;
    return true;
  });
  out.sort((a,b)=>{
    if(REVIEW_FILTERS.sort==='comments_desc')return reviewComments(b).length-reviewComments(a).length||reviewSortRank(a)-reviewSortRank(b);
    if(REVIEW_FILTERS.sort==='comments_asc')return reviewComments(a).length-reviewComments(b).length||reviewSortRank(a)-reviewSortRank(b);
    return reviewSortRank(a)-reviewSortRank(b)||String(b.updated_at||'').localeCompare(String(a.updated_at||''));
  });
  return out;
}
window.setReviewFilter=function(key,value){REVIEW_FILTERS[key]=value;renderReviewList(REVIEWS)}
window.resetReviewFilters=function(){REVIEW_FILTERS={status:'all',ai:'all',match:'all',sort:'default'};const vals={filterStatus:'all',filterAi:'all',filterMatch:'all',filterSort:'default'};Object.keys(vals).forEach(id=>{const el=document.getElementById(id);if(el)el.value=vals[id]});renderReviewList(REVIEWS)}
function updateReviewSubtabs(){if(!$('#reviewPrevTab'))return;$('#reviewPrevTab').classList.toggle('active',REVIEW_SIDE==='old');$('#reviewCurrentTab').classList.toggle('active',REVIEW_SIDE==='new');$('#aiBar').style.display=(isDiff()&&REVIEW_SIDE==='old')?'flex':'none'}
window.setReviewSide=function(side){REVIEW_SIDE=side;updateReviewSubtabs();renderReviewList(REVIEWS)}
function reviewPreviewText(rv){const comments=reviewComments(rv);return comments.length?comments[comments.length-1].text:(rv.comment||'(No comment)')}
function aiItemForReview(id){return (AI_ASSESSMENT.items||[]).find(x=>x.review_id===id)}
function renderAiBadge(item){if(!item)return '';const v=item.verdict||'unclear';return `<span class="aiBadge ${escapeHtml(v)}">${escapeHtml(v.replace('_',' '))}</span>`}
function renderAiReason(item){if(!item?.reasoning)return '';return `<div class="aiReason">${escapeHtml(item.reasoning)}</div>`}
function renderReviewSummary(rv){const comments=reviewComments(rv);const last=comments.length?comments[comments.length-1]:null;const more=Math.max(0,comments.length-1);const text=last?.text||rv.comment||'(No comment)';return `<div class="rvSummary"><div class="rvSummaryText">${escapeHtml(text)}</div>${more?`<span class="rvMoreCount">+${more}</span>`:''}</div>`}
function renderReviewList(reviews){const visible=filteredSortedReviews(reviews);const total=(reviews||[]).filter(rv=>reviewBelongsToSide(rv,REVIEW_SIDE)).length;const bar=$('#exportBar');if(bar)bar.style.display=visible.length?'flex':'none';$('#exportOldBtn').style.display=(isDiff()&&REVIEW_SIDE==='old')?'block':'none';$('#exportCurrentBtn').style.display=REVIEW_SIDE==='new'?'block':'none';const pane=$('#reviewPane');if(!visible.length){pane.innerHTML=`<div class="reviewPlaceholder">${total?'No comments match the current filters.':'No '+(REVIEW_SIDE==='old'?'previous':'current')+' comments yet. Drag text on the report to add one.'}</div>`;return}pane.innerHTML=visible.map(rv=>{const ai=aiItemForReview(rv.review_id);const oldActions=REVIEW_SIDE==='old'?`<button onclick="event.stopPropagation();moveReviewToCurrent('${rv.review_id}')">Forward</button><button onclick="event.stopPropagation();runReviewAiAssessment('${rv.review_id}')">AI</button>`:'';const accept=ai?`<button onclick="event.stopPropagation();saveAssessmentDecision('${rv.review_id}','${escapeHtml(ai.verdict||'unclear')}')">Accept</button>`:'';const actions=READ_ONLY?'':`<div class="rvActions"><button onclick="event.stopPropagation();addComment('${rv.review_id}')">Comment</button><button onclick="event.stopPropagation();toggleReview('${rv.review_id}','${isCleared(rv)?'open':'cleared'}')">${isCleared(rv)?'Reopen':'Clear'}</button>${oldActions}${accept}<button class="noteDelete" onclick="event.stopPropagation();deleteReview('${rv.review_id}')">Del</button></div><div class="rvReply" onclick="event.stopPropagation()"><textarea placeholder="Comment"></textarea><div class="rvReplyActions"><button onclick="event.stopPropagation();saveListComment('${rv.review_id}')">Comment</button><button onclick="event.stopPropagation();hideListReply('${rv.review_id}')">Cancel</button></div></div>`;const loc=reviewHasLocation(rv,REVIEW_SIDE)?`p.${firstPage(REVIEW_SIDE,rv)}`:'Floating';return `<div class="reviewRow ${isCleared(rv)?'cleared':'open'}" data-review-id="${rv.review_id}" onclick="focusReviewById('${rv.review_id}')"><div class="meta">${REVIEW_SIDE==='old'?'previous':'current'} ${loc} · ${reviewComments(rv).length} comment${reviewComments(rv).length===1?'':'s'} · ${isCleared(rv)?'cleared':'open'}${renderAiBadge(ai)}</div>${renderReviewSummary(rv)}${renderAiReason(ai)}${actions}</div>`}).join('')}
function firstPage(side,rv){const ids=rv[side+'_word_ids']||[];if(!ids.length||!WORDS[side]?.length)return '-';const w=WORDS[side][ids[0]];return w?w.page:'-'}
function focusReview(rv,displaySide){
  clearAnchorFocus();
  const primarySide=displaySide||(reviewBelongsToSide(rv,REVIEW_SIDE)?REVIEW_SIDE:(rv.old_word_ids?.length?'old':'new'));
  const newIds=reviewWordIdsForSide(rv,'new');
  if(newIds.length){if(primarySide==='new')showAnchorFocus('new',newIds);scrollWordIdsIntoPane('new',newIds)}
  else scrollReviewChangeFallback('new',rv);
  if(isDiff()){
    const oldIds=reviewWordIdsForSide(rv,'old');
    if(oldIds.length){if(primarySide==='old')showAnchorFocus('old',oldIds);scrollWordIdsIntoPane('old',oldIds)}
    else scrollReviewChangeFallback('old',rv);
  }
  document.querySelectorAll('.review,.reviewNote').forEach(e=>e.classList.toggle('active',e.dataset.reviewId===rv.review_id&&(!e.classList.contains('reviewNote')||e.dataset.side===primarySide)));
  document.querySelectorAll('.reviewRow').forEach(e=>e.classList.toggle('active',e.dataset.reviewId===rv.review_id));
}
window.focusReviewById=function(id){const matches=REVIEWS.filter(r=>r.review_id===id);const rv=matches.find(r=>reviewBelongsToSide(r,REVIEW_SIDE))||matches[0];if(rv)focusReview(rv,reviewBelongsToSide(rv,REVIEW_SIDE)?REVIEW_SIDE:undefined)}
window.toggleReview=async function(id,status){if(READ_ONLY){toast('Snapshot is read-only');return}try{await fetch(`${apiBase()}/reviews/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});setDirty(true);await loadReviews()}catch(e){toast('Failed to update status')}}
window.addComment=function(id){if(READ_ONLY){toast('Snapshot is read-only');return}showListReply(id)}
window.deleteReview=async function(id){if(READ_ONLY){toast('Snapshot is read-only');return}try{await fetch(`${apiBase()}/reviews/${id}`,{method:'DELETE'});setDirty(true);await loadReviews();clearAnchorFocus()}catch(e){toast('Failed to delete review')}}
window.moveReviewToCurrent=async function(id){if(READ_ONLY){toast('Snapshot is read-only');return}const ok=await askConfirm('Move this previous review to Current?');if(!ok)return;try{const res=await fetch(`${apiBase()}/migrate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({review_id:id})});const data=await res.json();if(!res.ok||data.error){toast(data.error||'Move failed');return}setDirty(true);REVIEW_SIDE='new';await loadReviews();updateReviewSubtabs();focusReviewById(id);toast(data.already_current?'Already in Current':'Moved to Current')}catch(e){toast('Move failed')}}
window.moveOpenPreviousReviewsToCurrent=async function(){if(READ_ONLY){toast('Snapshot is read-only');return}const targets=[...new Map((REVIEWS||[]).filter(rv=>reviewBelongsToSide(rv,'old')&&!isCleared(rv)).map(rv=>[rv.review_id,rv])).values()];if(!targets.length){toast('No open previous comments to forward.');return}const ok=await askConfirm(`Forward ${targets.length} open previous comment${targets.length===1?'':'s'} to Current?`);if(!ok)return;const btn=$('#moveOpenBtn');if(btn){btn.disabled=true;btn.textContent='Forwarding...'}let moved=0,failed=0,lastError='';try{for(const rv of targets){try{const res=await fetch(`${apiBase()}/migrate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({review_id:rv.review_id})});const data=await res.json();if(!res.ok||data.error){failed++;lastError=data.error||String(res.status)}else moved++}catch(e){failed++;lastError=e.message||'request failed'}}setDirty(true);REVIEW_SIDE='new';await loadReviews();updateReviewSubtabs();toast(`Forwarded ${moved}${failed?`, ${failed} failed${lastError?`: ${lastError}`:''}`:''}`)}finally{if(btn){btn.disabled=false;btn.textContent='Forward All'}}}
window.runAiAssessment=async function(){if(READ_ONLY){toast('Snapshot is read-only');return}if(!isDiff()){toast('Compare reports before running AI.');return}const btn=$('#runAiBtn');btn.disabled=true;btn.textContent='AI Running...';try{const res=await fetch(`${apiBase()}/assess`,{method:'POST'});const data=await res.json();if(!res.ok||data.error){toast(data.error||'AI check failed');return}AI_ASSESSMENT=data;setDirty(true);renderReviewList(REVIEWS);toast('AI check complete')}catch(e){toast('AI check failed')}finally{btn.disabled=false;btn.textContent='Run AI on All'}}
window.runReviewAiAssessment=async function(id){if(READ_ONLY){toast('Snapshot is read-only');return}try{const res=await fetch(`${apiBase()}/assess/${id}`,{method:'POST'});const data=await res.json();if(!res.ok||data.error){toast(data.error||'AI check failed');return}AI_ASSESSMENT=data;setDirty(true);renderReviewList(REVIEWS);focusReviewById(id);toast('AI check complete')}catch(e){toast('AI check failed')}}
window.saveAssessmentDecision=async function(id,decision){if(READ_ONLY){toast('Snapshot is read-only');return}try{const res=await fetch(`${apiBase()}/assess/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({human_decision:decision})});const data=await res.json();if(!res.ok||data.error){toast(data.error||'Failed to save decision');return}const item=aiItemForReview(id);if(item){item.human_decision=decision;item.human_updated_at=data.human_updated_at}setDirty(true);toast('Decision saved')}catch(e){toast('Failed to save decision')}}
window.exportPdf=function(side){if(!DATA)return;if(!REVIEWS.length){toast('No saved comments');return}window.open(`${apiBase()}/export/${side}`,'_blank')}
</script>
