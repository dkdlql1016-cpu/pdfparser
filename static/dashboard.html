<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard — Report Review Workspace</title>
<style>
:root{--blue:#2563eb;--ui-font:12px;--ui-font-sm:11px;--ai-font:13px;--ai-label-font:11px;--add:#059669;--del:#dc2626;--high:#dc2626;--medium:#d97706;--low:#059669}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f4f6;color:#111827;font-size:var(--ui-font)}
.sidebarRail{display:none;position:fixed;left:10px;top:8px;z-index:1600;width:30px;height:30px;padding:0;border-radius:8px;background:#111827;color:#fff;border:1px solid #374151;font-size:16px;line-height:30px;text-align:center;cursor:pointer}
body.sidebarCollapsed .sidebarRail{display:inline-block}
button{background:var(--blue);color:white;border:0;border-radius:8px;padding:7px 11px;font-weight:700;cursor:pointer}
button.secondary{background:#374151}
main{height:100vh;display:grid;grid-template-columns:1fr;overflow:hidden;transition:margin-left .18s ease}
body:not(.sidebarCollapsed) main{margin-left:320px}
body.sidebarCollapsed main{margin-left:0}
aside{position:fixed;left:0;top:0;width:320px;height:100vh;z-index:1500;background:white;border-right:1px solid #d1d5db;display:flex;flex-direction:column;transition:transform .18s ease}
body.sidebarCollapsed aside{transform:translateX(-100%);border-right:0;pointer-events:none}
.sideHeader{display:flex;align-items:center;gap:8px;height:40px;padding:5px 10px;border-bottom:1px solid #e5e7eb;background:#f8fafc}
.workspaceTitleRow{display:flex;align-items:center;gap:7px;min-width:0;width:100%}
.sideTitle{font-size:var(--ui-font);font-weight:800;color:#374151;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sideTitleInput{flex:none;min-width:0;max-width:180px;width:auto;height:26px;border:1px solid #cbd5e1;border-radius:6px;padding:2px 6px;font:var(--ui-font) system-ui;color:#111827}
.sideIconBtn{width:28px;height:28px;padding:0;border-radius:7px;background:#e5e7eb;color:#374151;display:inline-flex;align-items:center;justify-content:center;font-size:13px;border:0;cursor:pointer;flex:none;transition:background .12s ease,color .12s ease}
.sideIconBtn:hover{background:#d1d5db}
.sideIconBtn svg{width:15px;height:15px;display:block;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.sideIconBtnDashboard,.sideIconBtnAnalysis{font-weight:800;font-size:12px;letter-spacing:-.02em;line-height:1}
.sideIconBtnDashboard.active,.sideIconBtnAnalysis.active{background:#eef2ff;color:#1d4ed8}
.sideIconBtnDashboard.active:hover,.sideIconBtnAnalysis.active:hover{background:#e0e7ff}
.sideCollapse{margin-left:auto;width:28px;height:28px;padding:0;border-radius:7px;background:#111827;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;border:0;cursor:pointer;flex:none}
.sideSessions{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.sideListHead{padding:8px 10px;font-size:10px;font-weight:800;color:#6b7280;text-transform:uppercase;border-bottom:1px solid #e5e7eb;background:#f8fafc;flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sideListCount{font-weight:700;color:#94a3b8;font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0}
.sessionListPane{overflow:auto;flex:1;padding:8px;min-height:0}
.sessionListRow{padding:8px;margin-bottom:8px;border:1px solid #e5e7eb;border-radius:8px;cursor:pointer;background:#fff;font-size:var(--ui-font)}
.sessionListRow:hover{background:#f8fbff;border-color:#93c5fd}
.sessionListRow.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.12)}
.sessionListRow .meta{color:#6b7280;font-size:11px;margin-bottom:4px}
.sessionListRow .title{font-weight:700;color:#111827;line-height:1.35}
.sessionRowActions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.sessionRowActions button{padding:4px 8px;font-size:11px;font-weight:700;background:#eef2ff;color:#3730a3;border-radius:6px}
.sessionRowActions button.danger{background:#fef2f2;color:#b91c1c}
#dashboardMain{flex:1;overflow:hidden;background:#f1f5f9;padding:48px 14px 12px;display:flex;flex-direction:column;min-height:0}
.dashLayout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;flex:1;min-height:0;height:100%}
.dashLeft,.dashRight{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,23,42,.04);min-height:0}
.session{flex:none}
.changesPanel,.reviewsPanel{flex:1;display:flex;flex-direction:column;min-height:0}
.sessionTitle{font-size:16px;font-weight:800;color:#111827;line-height:1.3}
.sessionMeta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:11px;margin-top:12px;padding-top:12px;border-top:1px solid #f1f5f9}
.sessionMeta .k{color:#94a3b8;font-weight:700}.sessionMeta .v{color:#111827;font-weight:600;font-variant-numeric:tabular-nums}
.panelHead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:8px;flex:none}
.panelHead h2{margin:0;font-size:15px;font-weight:800}
.panelHead .sub{font-size:11px;color:#64748b;margin-top:2px}
.changesStatsLine{display:flex;align-items:baseline;gap:16px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #f1f5f9;flex:none;font-variant-numeric:tabular-nums}
.changesStatsLine .deltaBig{display:flex;align-items:baseline;gap:12px;font-size:17px;font-weight:800;line-height:1}
.changesStatsLine .statLabel{font-weight:700;color:#64748b;margin-right:4px}
.changesStatsLine .deltaBig .add{color:var(--add)}.changesStatsLine .deltaBig .del{color:var(--del)}
.changesStatsLine .groupsBig{font-size:17px;font-weight:800;color:#111827;line-height:1}
.changesStatsLine .groupsBig .groupsWord{font-weight:700;color:#64748b;margin-right:4px}
.changesStatsLine.muted{font-size:14px;font-weight:600;color:#94a3b8}
.riskGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:none;margin-bottom:10px}
.riskCard{border:1px solid #e5e7eb;border-radius:8px;padding:8px 10px;background:#fafbfc;cursor:pointer;text-align:center;font:inherit}
.riskCard:hover{background:#fff;border-color:#cbd5e1}
.riskCard.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.12);background:#fff}
.riskCard .code{font-size:11px;font-weight:800;letter-spacing:.03em}
.riskCard.high .code{color:var(--high)}.riskCard.medium .code{color:var(--medium)}
.riskCard.low .code{color:var(--low)}.riskCard.na .code{color:#94a3b8}
.riskCard .num{font-size:16px;font-weight:800;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums;color:#111827}
.changeStream{flex:1;min-height:0;border:1px solid #e5e7eb;border-radius:8px;background:#f8fafc;display:none;flex-direction:column;overflow:hidden}
.changeStream.show{display:flex}
.changeStream .streamMain .streamMeta{margin-bottom:18px}
.changeStream .streamSummary{margin-top:3px}
.streamBody{flex:1;overflow:auto;min-height:0}
.streamItem{display:flex;gap:10px;padding:8px 12px;border-bottom:1px solid #e5e7eb;background:#fff;align-items:flex-start;cursor:pointer}
.streamItem:last-child{border-bottom:0}
.streamItem:hover{background:#f8fbff}
.streamMain{flex:1;min-width:0}
.streamMeta{font-size:10px;color:#6b7280;margin-bottom:3px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.streamMeta .metaSep{opacity:.55}
.streamSummary{font-size:var(--ui-font);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.delText{background:#fee2e2;color:#991b1b;padding:1px 3px;border-radius:3px}
.addText{background:#dcfce7;color:#166534;padding:1px 3px;border-radius:3px}
.streamAi{flex:0 0 36%;min-width:0;font-size:var(--ai-font);line-height:1.45;padding:8px 10px;background:#f5f3ff;border-left:3px solid #a78bfa;border-radius:6px;color:#4c1d95;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.streamAi.empty{font-size:var(--ui-font-sm);color:#94a3b8;background:#f8fafc;border-color:#e5e7eb;font-style:italic;-webkit-line-clamp:1}
.changeStream .streamAi{flex:0 0 40%;display:block;overflow:visible;-webkit-line-clamp:unset;max-height:none;white-space:normal;font-size:var(--ai-font)}
.changeStream .streamAi.empty{-webkit-line-clamp:unset;font-size:var(--ui-font-sm)}
.changeStream .streamItem{align-items:flex-start}
.changeStream .streamAi .aiReason{background:transparent;border:0;padding:0;margin:0}
.changeStream .streamAi .aiField{margin-top:8px}
.changeStream .streamAi .aiField:first-of-type{margin-top:0}
.changeStream .streamAi .aiLabel{display:block;font-size:var(--ai-label-font);font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#7c3aed;margin-bottom:3px}
.changeStream .streamAi .aiValue{font-size:var(--ai-font);line-height:1.45;color:#4c1d95;white-space:normal}
.changeModalAi{margin-top:10px;padding:10px;background:#f5f3ff;border-left:3px solid #a78bfa;border-radius:6px;color:#4c1d95;font-size:var(--ai-font);line-height:1.5}
.changeModalAi.empty{font-size:var(--ui-font-sm);color:#94a3b8;background:#f8fafc;border-color:#e5e7eb;font-style:italic}
.changeModalAi .aiField{margin-top:10px}
.changeModalAi .aiLabel{display:block;font-size:var(--ai-label-font);font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#7c3aed;margin-bottom:4px}
.changeModalAi .aiValue{font-size:var(--ai-font);white-space:normal;line-height:1.5}
.reviewStream .streamAi{display:block;overflow:visible;-webkit-line-clamp:unset;max-height:none;white-space:normal;font-size:var(--ai-font);line-height:1.45;padding:8px 10px}
.reviewStream .streamAi.empty{font-size:var(--ui-font-sm);-webkit-line-clamp:unset}
.reviewStream .streamAi .aiReason{background:transparent;border:0;padding:0;margin:0}
.reviewStream .streamAi .aiField{margin-top:8px}
.reviewStream .streamAi .aiField:first-of-type{margin-top:0}
.reviewStream .streamAi .aiLabel{display:block;font-size:var(--ai-label-font);font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#7c3aed;margin-bottom:3px}
.reviewStream .streamAi .aiValue{font-size:var(--ai-font);line-height:1.45;color:#4c1d95;white-space:normal}
.reviewModalAi{margin-top:10px;padding:10px;border-left:3px solid #a78bfa;background:#f5f3ff;color:#4c1d95;font-size:var(--ai-font);line-height:1.5}
.reviewModalAi.empty{font-size:var(--ui-font-sm);color:#94a3b8;background:#f8fafc;border-color:#e5e7eb;font-style:italic}
.reviewModalAi .aiField{margin-top:10px}
.reviewModalAi .aiLabel{display:block;font-size:var(--ai-label-font);font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#7c3aed;margin-bottom:4px}
.reviewModalAi .aiValue{white-space:normal;line-height:1.5}
.riskBadge{display:inline-flex;align-items:center;gap:6px;margin-bottom:4px;font-weight:800}
.riskDot{width:9px;height:9px;border-radius:999px;display:inline-block}
.riskDot.high{background:#cf222e}
.riskDot.medium{background:#f59e0b}
.riskDot.low{background:#16a34a}
.reviewPanelBody{display:flex;flex-direction:column;flex:1;min-height:0;gap:10px}
.reportPicker{position:relative;flex:none}
.reportPickerBtn{width:100%;text-align:left;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;cursor:pointer;display:block;font:inherit}
.reportPickerBtn:hover{border-color:#cbd5e1}
.reportPickerRow{display:flex;align-items:center;gap:8px}
.reportPickerTag{font-size:10px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;flex:none}
.reportPickerName{font-size:14px;font-weight:800;color:#111827;flex:1;min-width:0;line-height:1.3}
.reportPickerChev{color:#94a3b8;font-size:12px;flex:none}
.reportPickerMeta{font-size:11px;color:#64748b;margin-top:6px}
.reportPickerMenu{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.1);display:none;z-index:40;overflow:hidden}
.reportPickerMenu.open{display:block}
.reportPickerItem{padding:10px 12px;cursor:pointer;border-bottom:1px solid #f1f5f9;font-size:12px}
.reportPickerItem:last-child{border-bottom:0}
.reportPickerItem:hover,.reportPickerItem.active{background:#f8fafc}
.reportPickerItem .pickTag{font-size:10px;font-weight:800;color:#94a3b8;text-transform:uppercase}
.reportPickerItem .pickName{font-weight:700;color:#111827;margin-top:2px}
.reviewStats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:none}
.reviewOriginBar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid #e5e7eb;background:#fff;flex:none}
.originFilter{font-size:10px;padding:3px 9px;border:1px solid #e5e7eb;border-radius:999px;background:#fff;color:#64748b;font-weight:700;cursor:pointer;font:inherit}
.originFilter:hover{border-color:#cbd5e1}
.originFilter.active.new{color:var(--del);border-color:#fecaca;background:#fef2f2}
.originFilter.forward{color:#7c3aed}
.originFilter.active.forward{color:#6d28d9;border-color:#ddd6fe;background:#f5f3ff}
.originFilter.active.all{color:var(--blue);border-color:#bfdbfe;background:#eef2ff}
.rvBadge{font-size:9px;font-weight:800;text-transform:lowercase;padding:2px 8px;border-radius:999px;line-height:1.35;flex:none;display:inline-block}
.rvBadge.new{color:#be123c;background:#ffe4e6}
.rvBadge.forward{color:#6d28d9;background:#ede9fe}
.rvBadge.open{color:#1d4ed8;background:#dbeafe}
.rvBadge.cleared{color:#64748b;background:#f1f5f9}
.streamMeta .rvBadge{margin-right:2px}
.reviewStat{border:1px solid #f1f5f9;border-radius:6px;padding:6px 4px;text-align:center;background:#fafbfc;cursor:pointer;font:inherit}
.reviewStat:hover{border-color:#cbd5e1;background:#fff}
.reviewStat.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.1);background:#fff}
.reviewStat .n{font-size:16px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:#111827}
.reviewStat .l{font-size:10px;font-weight:700;color:#64748b;margin-top:4px}
.reviewStream{flex:1;min-width:0;border:1px solid #e5e7eb;border-radius:8px;background:#f8fafc;display:none;overflow:hidden}
.reviewStream.show{display:flex;flex-direction:column}
.reviewStream .streamMain .streamMeta{margin-bottom:18px}
.reviewStream .streamSummary{margin-top:3px}
.reviewStream .streamItem.cleared{opacity:.52;background:#fafbfc}
.reviewStream .streamItem.cleared .streamMeta{color:#9ca3af}
.reviewStream .streamItem.cleared .streamSummary{color:#6b7280}
.reviewStream .streamItem.cleared .streamAi{opacity:.65;background:#f1f5f9;border-color:#e2e8f0;color:#94a3b8}
.reviewStream .streamItem.cleared .streamAi.empty{color:#cbd5e1}
.reviewStream .streamItem.cleared:hover{opacity:.68;background:#f8fafc}
.changeModalBackdrop,.reviewModalBackdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:3200;display:none;align-items:center;justify-content:center;padding:16px}
.reviewModalBackdrop{z-index:3250}
.changeModalBackdrop.open,.reviewModalBackdrop.open{display:flex}
.changeModalBox{width:min(880px,95vw);max-height:86vh;overflow:auto;background:#fff;border-radius:12px;box-shadow:0 25px 60px rgba(0,0,0,.3);padding:14px}
.reviewModalBox{width:min(720px,92vw);max-height:80vh;overflow:auto;background:#fff;border-radius:12px;box-shadow:0 25px 60px rgba(0,0,0,.3);padding:14px}
.changeModalHead,.reviewModalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.changeModalBody,.reviewModalBody{font-size:var(--ui-font);line-height:1.5;color:#111827}
.reviewModalBody .streamMeta{margin-bottom:18px}
.reviewModalBody>p{margin-top:6px}
.changeModalItem{padding:10px 0;border-bottom:1px solid #e5e7eb}
.changeModalItem .streamMeta{margin-bottom:18px}
.changeModalItem .changeModalDiff{margin-top:3px}
.changeModalItem:last-child{border-bottom:0}
.changeSection{font-size:10px;font-weight:800;color:#6b7280;margin-bottom:2px;line-height:1.35}
.changeModalDiff{line-height:1.45}
.streamMeta .changeArea{color:#374151;font-weight:600}
.streamMeta .changeArea .indexLabel{color:#111827;font-weight:700}
.streamMeta .changeArea .indexTitle{color:#374151;font-weight:600}
.empty{padding:20px;color:#6b7280;line-height:1.45}
.fmBackdrop{position:fixed;inset:0;background:rgba(15,23,42,.36);z-index:3000;display:none;align-items:center;justify-content:center}
.fmBox{width:min(1040px,92vw);max-height:78vh;overflow:auto;background:#fff;border-radius:12px;box-shadow:0 25px 60px rgba(0,0,0,.3);padding:12px}
.fmHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}.fmHeadTitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.fmHeadTitle strong{font-size:var(--ui-font)}.fmViewTabs{display:flex;gap:6px;flex-wrap:wrap}.fmViewTabs button{padding:4px 8px;font-size:var(--ui-font-sm)}.fmViewTabs button.active{background:#eef2ff;color:#1d4ed8}
.fmTable{width:100%;border-collapse:collapse;font-size:var(--ui-font)}
.fmTable th,.fmTable td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left}
.fmTable th{font-size:var(--ui-font-sm);color:#6b7280}
.fmActions{display:flex;gap:6px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 14px;border-radius:8px;font-size:var(--ui-font);z-index:4000;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw}
#toast.show{opacity:1}
@media(max-width:1100px){.dashLayout{grid-template-columns:1fr}}
</style>
</head>
<body>
<button id="sidebarRail" class="sidebarRail" type="button" title="Open panel">☰</button>
<main>
  <aside>
    <div class="sideHeader">
      <div class="workspaceTitleRow">
        <button id="workspaceHomeBtn" class="sideIconBtn" type="button" title="Home" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 10.5 12 4.5l7.5 6"/><path d="M6 10v9.5h12V10"/><path d="M10 19.5V14h4v5.5"/></svg></button>
        <button id="workspaceDashboardBtn" class="sideIconBtn sideIconBtnDashboard active" type="button" title="Dashboard">D</button>
        <button id="workspaceAnalysisBtn" class="sideIconBtn sideIconBtnAnalysis" type="button" title="Analysis">A</button>
        <button id="workspaceFilesBtn" class="sideIconBtn" type="button" title="File manager" aria-label="File manager"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="7" ry="2.5"/><path d="M5 5v14c0 1.38 3.13 2.5 7 2.5s7-1.12 7-2.5V5"/><path d="M5 9c0 1.38 3.13 2.5 7 2.5s7-1.12 7-2.5"/><path d="M5 13c0 1.38 3.13 2.5 7 2.5s7-1.12 7-2.5"/></svg></button>
        <button id="workspaceRenameBtn" class="sideIconBtn" type="button" title="Rename workspace">✎</button>
        <span id="workspaceTitle" class="sideTitle">Workspace</span>
      </div>
      <button id="sidebarCollapseBtn" class="sideCollapse" type="button" title="Collapse panel">‹</button>
    </div>
    <div class="sideSessions">
      <div class="sideListHead"><span>Sessions</span><span class="sideListCount" id="sessionListCount">0</span></div>
      <div id="sessionListPane" class="sessionListPane"><div class="empty">Open a workspace from File Manager.</div></div>
    </div>
  </aside>
  <section id="dashboardMain">
    <div class="dashLayout">
      <div class="dashLeft">
        <div class="panel session">
          <div class="sessionTitle" id="sessionLabel">Select a session</div>
          <div class="sessionMeta" id="sessionMetaBar"></div>
        </div>
        <section class="panel changesPanel">
          <div class="panelHead"><div><h2>Changes</h2></div></div>
          <div class="changesStatsLine muted" id="changesStatsLine">
            <span class="deltaBig" id="changeDelta" style="display:none"></span>
            <span class="groupsBig"><span class="groupsWord">change group</span><span id="changeTotal">0</span></span>
          </div>
          <div class="riskGrid" id="riskGrid">
            <button type="button" class="riskCard high" data-risk="high"><div class="code">H</div><div class="num">0</div></button>
            <button type="button" class="riskCard medium" data-risk="medium"><div class="code">M</div><div class="num">0</div></button>
            <button type="button" class="riskCard low" data-risk="low"><div class="code">L</div><div class="num">0</div></button>
            <button type="button" class="riskCard na" data-risk="na"><div class="code">N/A</div><div class="num">0</div></button>
          </div>
          <div class="changeStream" id="changeStream"><div class="streamBody" id="changeStreamBody"></div></div>
        </section>
      </div>
      <div class="dashRight">
        <section class="panel reviewsPanel">
          <div class="panelHead"><div><h2>Reviews</h2><p class="sub">Comments on each report</p></div></div>
          <div class="reviewPanelBody">
            <div class="reportPicker">
              <button type="button" class="reportPickerBtn" id="reportPickerBtn" aria-expanded="false">
                <div class="reportPickerRow">
                  <span class="reportPickerTag" id="reportPickerTag">Current</span>
                  <span class="reportPickerName" id="reportPickerName">—</span>
                  <span class="reportPickerChev" id="reportPickerChev">▼</span>
                </div>
                <div class="reportPickerMeta" id="reportPickerMeta">—</div>
              </button>
              <div class="reportPickerMenu" id="reportPickerMenu"></div>
            </div>
            <div class="reviewStats" id="reviewStatsRow">
              <button type="button" class="reviewStat active" data-filter="total"><div class="n">0</div><div class="l">Total</div></button>
              <button type="button" class="reviewStat" data-filter="cleared"><div class="n">0</div><div class="l">Cleared</div></button>
              <button type="button" class="reviewStat" data-filter="open"><div class="n">0</div><div class="l">Open</div></button>
            </div>
            <div class="reviewStream show" id="reviewStream">
              <div class="reviewOriginBar" id="reviewOriginBar">
                <button type="button" class="originFilter new" data-origin="new">new</button>
                <button type="button" class="originFilter forward" data-origin="forward">forward</button>
                <button type="button" class="originFilter all active" data-origin="all">all</button>
              </div>
              <div class="streamBody" id="reviewStreamBody"></div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </section>
</main>
<div id="changeListModal" class="changeModalBackdrop">
  <div class="changeModalBox">
    <div class="changeModalHead"><strong id="changeModalTitle">Changes</strong><button type="button" class="secondary" id="changeModalClose">Close</button></div>
    <div class="changeModalBody" id="changeModalBody"></div>

  <div class="reviewModalBox">
    <div class="reviewModalHead"><strong id="reviewListModalTitle">Comments</strong><button type="button" class="secondary" id="reviewListModalClose">Close</button></div>
    <div class="reviewModalBody" id="reviewListModalBody"></div>
  </div>

    <div class="reviewModalHead"><strong id="reviewModalTitle">Comment</strong><button type="button" class="secondary" id="reviewModalClose">Close</button></div>
    <div class="reviewModalBody" id="reviewModalBody"></div>
  </div>

<div id="fmDialog" class="fmBackdrop"><div class="fmBox"><div class="fmHead"><div id="fmDialogTitle" class="fmHeadTitle"><strong>Files</strong></div><button type="button" class="secondary" id="fmCloseBtn">Close</button></div><div id="fmTableWrap"></div></div></div>
<div id="toast"></div>
<script src="/static/shared.js?v=20260612-1"></script>
<script>
(function(){
  const {FileManager, updateFilesBtnLabel, ensureDefaultWorkspace}=PdfShared;
  const $=(s)=>document.querySelector(s);
  let DOC_ID=null, RUN_ID=null, SNAPSHOT_ID=null, ORIGIN_RUN_ID=null, WORKSPACE_TITLE='Workspace';
  let WORKSPACE_RUNS=[];
  let WORKSPACE_RENAME_INPUT=null, WORKSPACE_RENAME_ORIGINAL=null;
  let SESSIONS=[], DATA=null, REVIEWS=[], AI_ASSESSMENT={items:[]}, CHANGE_AI_ASSESSMENT={items:[]};
  let CHANGE_BUCKETS={high:[],medium:[],low:[],na:[]}, REPORTS={};
  let activeSessionId=null, activeRisk=null, activeReportSide='old';
  let activeStatusFilter='total', activeOriginNew=false, activeOriginForward=false;

  function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800)}
  function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function escAttr(s){return esc(s)}
  function trim(s,n=160){s=String(s||'');return s.length>n?s.slice(0,n-1)+'...':s}
  function formatDate(s){if(!s)return '—';return String(s).replace('T',' ').slice(0,19)||'—'}
  function titleFromFilename(name){return String(name||'Workspace').replace(/\.pdf$/i,'')}
  const INTERNAL_PDF_NAMES=new Set(['source.pdf','report.pdf','prev_report.pdf','old.pdf','new.pdf','']);
  function publicReportFilename(name,fallback){
    const n=String(name||'').trim();
    return INTERNAL_PDF_NAMES.has(n.toLowerCase())?(fallback||'report.pdf'):n;
  }
  function runMetaById(runId){
    if(!runId)return {};
    return WORKSPACE_RUNS.find(r=>r.run_id===runId)||{};
  }
  function activeSession(){return SESSIONS.find(s=>s.id===activeSessionId)||null}
  function activeRunMeta(){
    const session=activeSession();
    if(session?.run?.run_id)return session.run;
    const runId=session?.run_id||RUN_ID;
    const fromMeta=runMetaById(runId);
    if(fromMeta.run_id)return fromMeta;
    const sourceId=session?.snapshot?.source_run_id||session?.snapshot?.run_id;
    return runMetaById(sourceId)||{};
  }
  function reportFilenameForSide(side){
    const session=activeSession();
    const runMeta=activeRunMeta();
    const snap=session?.snapshot||{};
    if(side==='new'){
      return publicReportFilename(
        snap.filename,
        publicReportFilename(runMeta.filename, publicReportFilename(DATA?.new_filename||DATA?.filename,'report.pdf'))
      );
    }
    const prevRun=runMeta.previous_run_id?runMetaById(runMeta.previous_run_id):null;
    let oldName=prevRun?.filename||'';
    if(!oldName||INTERNAL_PDF_NAMES.has(String(oldName).toLowerCase())){
      const label=String(session?.label||'');
      if(label.includes('→'))oldName=label.split('→')[0].trim();
    }
    return publicReportFilename(oldName,'previous.pdf');
  }
  function isDiff(){return DATA?.mode==='diff'}
  function snapshotApiBase(){return `/api/documents/${DOC_ID}/snapshots/${SNAPSHOT_ID}`}
  function viewerLink(extra={}){const q=new URLSearchParams();if(DOC_ID)q.set('doc',DOC_ID);if(RUN_ID)q.set('run',RUN_ID);Object.entries(extra).forEach(([k,v])=>{if(v!=null&&v!=='')q.set(k,String(v))});return '/?'+q.toString()}
  // When the user arrived from the viewer's active run, return to that exact run so the
  // dashboard round-trip does not reset it. Falls back to the active session's run.
  function backToViewerLink(){const q=new URLSearchParams();if(DOC_ID)q.set('doc',DOC_ID);const run=ORIGIN_RUN_ID||RUN_ID;if(run)q.set('run',run);return '/?'+q.toString()}

  function normalizeChangeVerdict(v){
    const raw=String(v||'').toLowerCase().trim();
    if(raw==='risk')return 'medium';
    if(raw==='no_risk'||raw==='unclear'||raw==='unknown')return 'low';
    if(raw==='high'||raw==='medium'||raw==='low')return raw;
    return 'low';
  }
  // Human workflow only — never infer from AI assessment verdict/decision.
  function isHumanCleared(rv){return rv.status==='cleared'||rv.status==='resolved'}
  function reviewBelongsToSide(rv,side){return side==='old'?((rv.old_word_ids||[]).length>0||rv.side==='old'):((rv.new_word_ids||[]).length>0||rv.side==='new')}
  function reviewComments(rv){return Array.isArray(rv.comments)?rv.comments:[]}
  function reviewText(rv){const cs=reviewComments(rv);return cs.length?cs[cs.length-1].text:(rv.comment||'(No comment)')}
  function changeAiItemForId(id){return (CHANGE_AI_ASSESSMENT.items||[]).find(x=>Number(x.change_id)===Number(id))}
  function aiItemForReview(id){return (AI_ASSESSMENT.items||[]).find(x=>x.review_id===id)}

  function verdictLabel(value){return String(value||'unclear').replace(/_/g,' ').toUpperCase()}
  // Review verdict -> colored dot class + display text, mirroring the viewer (index.html).
  function reviewVerdictClass(value){
    const raw=String(value||'').toLowerCase().trim();
    if(raw==='cleared')return 'low';      // green
    if(raw==='not_cleared')return 'high'; // red
    return 'medium';                       // yellow: partial / unclear / anything else
  }
  function reviewVerdictText(value){
    const raw=String(value||'').toLowerCase().trim();
    const map={cleared:'Cleared',not_cleared:'Not cleared',partial:'Partial',unclear:'Unclear'};
    if(map[raw])return map[raw];
    const s=verdictLabel(value).toLowerCase();
    return s.charAt(0).toUpperCase()+s.slice(1);
  }

  function renderChangeAiBlock(aiItem,wrapClass){
    const empty=`<div class="${wrapClass} empty">No AI</div>`;
    if(!aiItem||!(aiItem.reasoning||aiItem.verdict||aiItem.recommended_comment))return empty;
    const assessed=!!(aiItem.status==='done'&&String(aiItem.verdict||'').trim());
    if(!assessed&&!String(aiItem.reasoning||'').trim()&&!String(aiItem.recommended_comment||'').trim())return empty;
    const verdict=normalizeChangeVerdict(aiItem.verdict);
    const reason=String(aiItem.reasoning||'').trim();
    const rec=verdict==='low'?'':String(aiItem.recommended_comment||'').trim();
    const parts=[];
    if(reason)parts.push(`<div class="aiField"><span class="aiLabel">Reasoning</span><div class="aiValue">${esc(reason)}</div></div>`);
    if(rec)parts.push(`<div class="aiField"><span class="aiLabel">Suggested review</span><div class="aiValue">${esc(rec)}</div></div>`);
    if(!parts.length)return empty;
    return `<div class="${wrapClass}"><div class="aiReason">${parts.join('')}</div></div>`;
  }

  function renderReviewAiBlock(aiItem,wrapClass){
    const empty=`<div class="${wrapClass} empty">No AI</div>`;
    if(!aiItem||!(aiItem.reasoning||aiItem.verdict))return empty;
    const assessed=!!(aiItem.status==='done'&&String(aiItem.verdict||'').trim());
    if(!assessed&&!String(aiItem.reasoning||'').trim())return empty;
    const aiVerdict=aiItem.verdict||'unclear';
    const reason=String(aiItem.reasoning||'').trim();
    const parts=[`<div class="aiField"><span class="aiLabel">Verdict</span><div class="aiValue"><span class="riskBadge"><span class="riskDot ${esc(reviewVerdictClass(aiVerdict))}"></span>${esc(reviewVerdictText(aiVerdict))}</span></div></div>`];
    if(reason)parts.push(`<div class="aiField"><span class="aiLabel">Reasoning</span><div class="aiValue">${esc(reason)}</div></div>`);
    return `<div class="${wrapClass}"><div class="aiReason">${parts.join('')}</div></div>`;
  }

  function updateWorkspaceTitle(){const el=$('#workspaceTitle');if(el)el.textContent=WORKSPACE_TITLE||'Workspace'}
  function syncUrl(){
    if(!DOC_ID)return;
    const q=new URLSearchParams();
    q.set('doc',DOC_ID);
    if(SNAPSHOT_ID)q.set('snapshot',SNAPSHOT_ID);
    history.replaceState(null,'','/dashboard?'+q.toString());
  }

  function indexTypeLabel(it){
    if(!it)return 'SECTION';
    if(it.type==='fs')return 'FINANCIAL STATEMENT';
    if(it.type==='note')return 'NOTE';
    return String(it.type||'SECTION').toUpperCase();
  }
  const SKIP_INDEX_TYPES=new Set(['cover','contents','toc']);
  function sectionEntriesFromData(){
    const sm=DATA?.section_map;
    if(!sm)return [];
    const raw=sm.sections||sm;
    if(Array.isArray(raw))return raw;
    return Object.entries(raw||{}).map(([section_id,meta])=>({section_id,...meta}));
  }
  function sectionEntryById(sectionId){
    if(!sectionId)return null;
    return sectionEntriesFromData().find(s=>s.section_id===sectionId)||null;
  }
  function sectionForReviewByNearbyChange(rv,side){
    const page=(side==='old'?rv.old_page:rv.new_page)||rv.page||rv.selection?.page;
    const rect=rv.selection?.rect;
    if(!page||!rect||!DATA?.changes?.length)return null;
    const midY=(rect[1]+rect[3])/2;
    let best=null,bestDist=Infinity;
    for(const ch of DATA.changes){
      const chPage=side==='old'?ch.old_page:ch.new_page;
      if(chPage!==page)continue;
      const anchor=side==='old'?ch.old_anchor:ch.new_anchor;
      if(!anchor?.bbox)continue;
      const anchorMid=(anchor.bbox[1]+anchor.bbox[3])/2;
      const dist=Math.abs(midY-anchorMid);
      if(dist<bestDist){bestDist=dist;best=ch}
    }
    return best?sectionForChange(best):null;
  }
  function sectionForReview(rv,side){
    const sectionId=rv.section_id||rv.md_anchor?.section_id;
    const byId=sectionEntryById(sectionId);
    if(byId)return byId;
    const lines=side==='old'?(rv.old_lines||rv.md_anchor?.old_lines||[]):(rv.new_lines||rv.md_anchor?.new_lines||[]);
    const seg=Array.isArray(lines)&&lines.length?lines[0]:null;
    const page=(side==='old'?rv.old_page:rv.new_page)||rv.page||rv.selection?.page;
    if(seg!=null){
      const bySeg=sectionForChange({seg_start:seg,new_page:page,old_page:page});
      if(bySeg)return bySeg;
    }
    const byChange=sectionForReviewByNearbyChange(rv,side);
    if(byChange)return byChange;
    return sectionForChange({seg_start:null,new_page:page,old_page:page});
  }
  function indexHeadingForReview(rv,side){
    const section=sectionForReview(rv,side);
    if(section){
      const {label,title}=sectionLabelsForMeta(section);
      return {label,title};
    }
    const page=(side==='old'?rv.old_page:rv.new_page)||rv.page||rv.selection?.page;
    const it=indexItemForPage(DATA?.index_items||[],page,side);
    if(!it)return {label:'',title:''};
    const label=it.type==='note'&&it.note_no?`Note ${it.note_no}`:(it.label||it.title||indexTypeLabel(it));
    const title=it.title||'';
    return {label,title};
  }
  function sectionForChange(c){
    const seg=c.seg_start??c.seg_end;
    const page=c.new_page||c.old_page;
    const sections=sectionEntriesFromData();
    if(seg!=null&&sections.length){
      const hit=sections.find(s=>s.start_line!=null&&s.end_line!=null&&seg>=s.start_line&&seg<=s.end_line);
      if(hit)return hit;
    }
    if(page!=null&&sections.length){
      const hit=sections.find(s=>s.page_start!=null&&s.page_end!=null&&page>=s.page_start&&page<=s.page_end);
      if(hit)return hit;
    }
    return null;
  }
  function sectionLabelsForMeta(section){
    if(!section)return {label:'',title:''};
    const title=String(section.title||section.label||'').trim();
    if(section.type==='note'&&section.note_no){
      return {label:`Note ${section.note_no}`,title};
    }
    if(section.type==='fs'){
      return {label:'FINANCIAL STATEMENT',title:title||'Financial Statement'};
    }
    const type=indexTypeLabel(section);
    return {label:type,title:title||type};
  }
  function indexItemForPage(indexItems,page,side){
    if(!page||!indexItems?.length)return null;
    let best=null,bestPage=-1;
    for(const it of indexItems){
      if(SKIP_INDEX_TYPES.has(String(it.type||'').toLowerCase()))continue;
      const p=side==='old'?(it.old_page??it.page):it.page;
      if(p==null)continue;
      if(p<=page&&p>=bestPage){best=it;bestPage=p}
    }
    return best;
  }
  function indexHeadingForChange(c){
    const section=sectionForChange(c);
    if(section){
      const {label,title}=sectionLabelsForMeta(section);
      return {label,title,indexItem:null,section};
    }
    const page=c.new_page||c.old_page;
    const it=indexItemForPage(DATA?.index_items||[],page,'new');
    const label=it?(it.type==='note'&&it.note_no?`Note ${it.note_no}`:(it.label||it.title||indexTypeLabel(it))):('');
    const title=it?(it.title||''):('');
    return {label,title,indexItem:it};
  }
  function changeSectionFor(c){
    const page=c.new_page||c.old_page||'-';
    const {label,title,indexItem,section}=indexHeadingForChange(c);
    if(section){
      const head=title||label||'Change';
      const type=section.type==='note'&&section.note_no?`Note ${section.note_no}`:indexTypeLabel(section);
      return `${type} · p.${page} · ${head}`;
    }
    const type=indexTypeLabel(indexItem);
    const head=title||label||'Change';
    return `${type} · p.${page} · ${head}`;
  }
  function changeSummaryHtml(c){
    const parts=[];
    if(c.old)parts.push('<span class="delText">− '+esc(trim(c.old))+'</span>');
    if(c.new)parts.push('<span class="addText">+ '+esc(trim(c.new))+'</span>');
    return parts.join(' ')||'(empty)';
  }
  function indexHeadingHtml(c){
    const raw=c.raw||c;
    const {label,title}=indexHeadingForChange(raw);
    if(!label&&!title)return '';
    if(!title||label===title)return '<span class="indexLabel">'+esc(label||title)+'</span>';
    return '<span class="indexLabel">'+esc(label)+'</span> · <span class="indexTitle">'+esc(title)+'</span>';
  }
  function changeAreaMetaHtml(c){
    const head=indexHeadingHtml(c);
    if(head)return '<span class="changeArea">'+head+'</span>';
    const section=c.section||(c.raw?changeSectionFor(c.raw):'');
    if(section)return '<span class="changeArea">'+esc(section)+'</span>';
    return '';
  }

  function buildChangeViewModels(){
    const changes=DATA?.changes||[];
    const buckets={high:[],medium:[],low:[],na:[]};
    for(const raw of changes){
      const ai=changeAiItemForId(raw.id);
      const assessed=!!(ai&&ai.status==='done'&&String(ai.verdict||'').trim());
      const risk=assessed?normalizeChangeVerdict(ai.verdict):'na';
      const vm={
        id:Number(raw.id),
        old:raw.old_text||'',
        new:raw.new_text||'',
        ai:assessed?(ai.reasoning||ai.recommended_comment||''):null,
        indexLabel:indexHeadingForChange(raw).label,
        indexTitle:indexHeadingForChange(raw).title,
        section:changeSectionFor(raw),
        raw
      };
      buckets[risk].push(vm);
    }
    CHANGE_BUCKETS=buckets;
  }

  function buildReviewViewModels(side){
    return (REVIEWS||[]).filter(rv=>reviewBelongsToSide(rv,side)).map(rv=>{
      const ai=aiItemForReview(rv.review_id);
      const {label,title}=indexHeadingForReview(rv,side);
      return {
        id:rv.review_id,
        text:reviewText(rv),
        status:isHumanCleared(rv)?'cleared':'open',
        origin:rv.copied_from_review_id?'forward':'new',
        aiItem:ai||null,
        indexLabel:label,
        indexTitle:title,
        raw:rv
      };
    });
  }
  function reviewBucketForSide(side){
    const all=buildReviewViewModels(side);
    return {total:all,open:all.filter(r=>r.status==='open'),cleared:all.filter(r=>r.status==='cleared')};
  }

  function latestSessionId(){
    if(!SESSIONS.length)return null;
    const sorted=[...SESSIONS].sort((a,b)=>String(b.snapshot?.created_at||'').localeCompare(String(a.snapshot?.created_at||'')));
    return sorted[0]?.id||SESSIONS[0].id;
  }

  function buildSessionsFromSnapshots(snapshots,runs){
    const byId=new Map((runs||[]).map(r=>[r.run_id,r]));
    return [...(snapshots||[])].sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''))).map(snap=>{
      const run=byId.get(snap.run_id)||byId.get(snap.source_run_id)||{};
      const prev=run.previous_run_id?byId.get(run.previous_run_id):null;
      const fn=publicReportFilename(snap.filename,run.filename||'report.pdf');
      const compared=!!(snap.has_diff||snap.mode==='diff');
      const customLabel=String(snap.label||'').trim();
      const label=customLabel||(compared&&prev
        ? publicReportFilename(prev.filename,'previous.pdf')+' → '+fn
        : fn);
      return {
        id:snap.snapshot_id,
        snapshot_id:snap.snapshot_id,
        run_id:snap.run_id,
        label,
        created:formatDate(snap.created_at),
        updated:formatDate(snap.created_at),
        compared,
        add:0,del:0,changes:0,
        open_reviews:snap.open_reviews||0,
        closed_reviews:snap.closed_reviews||0,
        snapshot:snap,
        run
      };
    });
  }

  function rebuildReports(){
    if(!DATA){REPORTS={};return}
    const runMeta=activeRunMeta();
    const newFile=reportFilenameForSide('new');
    if(isDiff()){
      const oldFile=reportFilenameForSide('old');
      REPORTS={
        old:{side:'old',tag:'Previous',name:oldFile,file:oldFile,pages:DATA.old_page_count||0,modified:formatDate(runMetaById(runMeta.previous_run_id).created_at||runMeta.created_at)},
        new:{side:'new',tag:'Current',name:newFile,file:newFile,pages:DATA.new_page_count||DATA.page_count||0,modified:formatDate(runMeta.updated_at||runMeta.created_at)}
      };
      if(!REPORTS[activeReportSide])activeReportSide='old';
    }else{
      REPORTS={
        new:{side:'new',tag:'Current',name:newFile,file:newFile,pages:DATA.new_page_count||DATA.page_count||0,modified:formatDate(runMeta.created_at)}
      };
      activeReportSide='new';
    }
  }

  async function loadSnapshotData(snapshotId){
    const session=SESSIONS.find(s=>s.id===snapshotId);
    if(!session){toast('Session not found');return}
    try{
      SNAPSHOT_ID=snapshotId;
      RUN_ID=session.run_id||null;
      syncUrl();
      const base=snapshotApiBase();
      const [snapRes,reviews,assess,changeAssess]=await Promise.all([
        fetch(base).then(r=>{if(!r.ok)throw new Error('snapshot not found');return r.json()}),
        fetch(`${base}/reviews`).then(r=>r.ok?r.json():[]),
        fetch(`${base}/assess`).then(r=>r.ok?r.json():{items:[]}),
        fetch(`${base}/change-assess`).then(r=>r.ok?r.json():{items:[]})
      ]);
      DATA=snapRes.result;
      REVIEWS=reviews||[];
      AI_ASSESSMENT=assess||{items:[]};
      CHANGE_AI_ASSESSMENT=changeAssess||{items:[]};
      session.compared=DATA?.mode==='diff';
      session.changes=(DATA?.changes||[]).length;
      session.add=DATA?.summary?.added||0;
      session.del=DATA?.summary?.deleted||0;
      buildChangeViewModels();
      rebuildReports();
      if(isDiff()&&REPORTS.old)activeReportSide='old';
      activeSessionId=snapshotId;
      activeStatusFilter='total';
      activeOriginNew=false;
      activeOriginForward=false;
      activeRisk=session.compared?'high':null;
      renderAll();
    }catch(e){
      toast('Failed to load session');
    }
  }

  async function openWorkspace(docId,snapshotId){
    DOC_ID=docId;
    SNAPSHOT_ID=null;
    RUN_ID=null;
    DATA=null;
    activeSessionId=null;
    const meta=await fetch(`/api/documents/${docId}`).then(r=>{if(!r.ok)throw new Error('workspace not found');return r.json()});
    WORKSPACE_TITLE=meta.title||'Workspace';
    WORKSPACE_RUNS=meta.runs||[];
    updateWorkspaceTitle();
    updateFilesBtnLabel(DOC_ID);
    SESSIONS=buildSessionsFromSnapshots(meta.snapshots||[],WORKSPACE_RUNS);
    const pick=snapshotId||latestSessionId();
    renderSessionList();
    if(pick)await loadSnapshotData(pick);
    else renderEmptyDashboard();
  }

  function renderEmptyDashboard(){
    $('#sessionLabel').textContent='Select a session';
    $('#sessionMetaBar').innerHTML='';
    $('#changeTotal').textContent='0';
    renderRiskCounts();
    renderChangeStream();
    renderReviewStream();
  }

  function sessionEmptyMessage(){
    return DOC_ID
      ? 'No saved sessions yet. Save a snapshot from History in the viewer.'
      : 'Open a workspace from File Manager.';
  }

  function renderAll(){
    renderSessionList();
    selectSessionUi(activeSessionId);
    renderRiskCounts();
    renderChangeStats();
    renderReportPicker();
    selectReportSide(activeReportSide);
    renderChangeStream();
    renderReviewStream();
  }

  function renderSessionList(){
    const pane=$('#sessionListPane'),countEl=$('#sessionListCount');
    if(countEl)countEl.textContent=String(SESSIONS.length);
    if(!pane)return;
    if(!SESSIONS.length){pane.innerHTML='<div class="empty">'+esc(sessionEmptyMessage())+'</div>';return}
    pane.innerHTML=SESSIONS.map(s=>{
      const active=s.id===activeSessionId?' active':'';
      return `<div class="sessionListRow${active}" data-session-id="${escAttr(s.id)}"><div class="meta">${esc(s.updated)}</div><div class="title">${esc(s.label)}</div><div class="sessionRowActions"><button type="button" data-act="rename" data-id="${escAttr(s.id)}">Rename</button><button type="button" class="danger" data-act="delete" data-id="${escAttr(s.id)}">Delete</button></div></div>`;
    }).join('');
    pane.querySelectorAll('.sessionListRow').forEach(row=>{
      row.addEventListener('click',e=>{if(e.target.closest('[data-act]'))return;loadSnapshotData(row.dataset.sessionId)});
    });
    pane.querySelectorAll('[data-act]').forEach(btn=>{
      btn.addEventListener('click',e=>{e.stopPropagation();const id=btn.dataset.id;if(btn.dataset.act==='rename')renameSession(id);else deleteSession(id)});
    });
  }

  async function renameSession(id){
    if(!DOC_ID)return;
    const next=window.prompt('Rename snapshot');
    if(next===null)return;
    try{
      const res=await fetch(`/api/documents/${DOC_ID}/snapshots/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({label:next.trim()})});
      const data=await res.json();
      if(!res.ok||data.error){toast(data.error||'Rename failed');return}
      await openWorkspace(DOC_ID,id);
      toast('Snapshot renamed');
    }catch(e){toast('Rename failed')}
  }
  async function deleteSession(id){
    if(!DOC_ID)return;
    if(!window.confirm('Delete this snapshot?'))return;
    try{
      const res=await fetch(`/api/documents/${DOC_ID}/snapshots/${id}`,{method:'DELETE'});
      const data=await res.json();
      if(!res.ok||data.error){toast(data.error||'Delete failed');return}
      const keep=(activeSessionId&&activeSessionId!==id)?activeSessionId:null;
      await openWorkspace(DOC_ID,keep);
      toast('Snapshot deleted');
    }catch(e){toast('Delete failed')}
  }

  function selectSessionUi(id){
    const s=SESSIONS.find(x=>x.id===id);
    if(!s)return;
    $('#sessionLabel').textContent=s.label;
    $('#sessionMetaBar').innerHTML=
      `<span><span class="k">saved_at</span> <span class="v">${esc(s.created)}</span></span>`+
      `<span><span class="k">reviews</span> <span class="v">${esc(String(s.open_reviews||0))} open / ${esc(String(s.closed_reviews||0))} closed</span></span>`;
  }

  function renderRiskCounts(){
    document.querySelectorAll('.riskCard').forEach(el=>{
      const k=el.dataset.risk;
      const num=el.querySelector('.num');
      if(num)num.textContent=String((CHANGE_BUCKETS[k]||[]).length);
    });
  }

  function renderChangeStats(){
    const s=SESSIONS.find(x=>x.id===activeSessionId);
    const statsLine=$('#changesStatsLine'),deltaEl=$('#changeDelta'),totalEl=$('#changeTotal');
    if(!s||!totalEl)return;
    totalEl.textContent=String(s.changes||0);
    if(s.compared){
      statsLine.classList.remove('muted');
      deltaEl.style.display='';
      deltaEl.innerHTML=`<span class="add"><span class="statLabel">add</span>+${s.add||0}</span><span class="del"><span class="statLabel">del</span>−${s.del||0}</span>`;
    }else{
      statsLine.classList.add('muted');
      deltaEl.style.display='none';
    }
  }

  function changeItemHtml(c,compact){
    const ai=compact?renderChangeAiBlock(changeAiItemForId(c.id),'streamAi'):'';
    const summary=`<div class="streamSummary">${changeSummaryHtml(c)}</div>`;
    const area=changeAreaMetaHtml(c);
    return `<div class="streamItem" data-change-id="${c.id}"><div class="streamMain"><div class="streamMeta">#${c.id}${area?' · '+area:''}</div>${summary}</div>${ai}</div>`;
  }
  function changeModalItemHtml(c){
    const aiItem=changeAiItemForId(c.id);
    const area=changeAreaMetaHtml(c);
    return `<div class="changeModalItem"><div class="streamMeta">#${c.id}${area?' · '+area:''}</div><div class="changeModalDiff">${changeSummaryHtml(c)}</div>${renderChangeAiBlock(aiItem,'changeModalAi')}<div style="margin-top:8px"><a href="${viewerLink({tab:'diff',change:c.id})}">Open in viewer</a></div></div>`;
  }

  function renderChangeStream(){
    const stream=$('#changeStream'),body=$('#changeStreamBody');
    const session=SESSIONS.find(s=>s.id===activeSessionId);
    document.querySelectorAll('.riskCard').forEach(el=>el.classList.toggle('active',el.dataset.risk===activeRisk));
    if(!body||!stream)return;
    if(!session||!session.compared||!activeRisk){stream.classList.remove('show');body.innerHTML='';return}
    const items=CHANGE_BUCKETS[activeRisk]||[];
    stream.classList.add('show');
    if(!items.length){body.innerHTML='<div style="padding:12px;color:#94a3b8">No items.</div>';return}
    body.innerHTML=items.map(c=>changeItemHtml(c,true)).join('');
    body.querySelectorAll('.streamItem').forEach(el=>{
      el.addEventListener('click',()=>{
        const c=items.find(x=>x.id===Number(el.dataset.changeId));
        if(c)openChangeModal(c);
      });
    });
  }

  function openChangeModal(c){
    $('#changeModalTitle').textContent='Change #'+c.id;
    $('#changeModalBody').innerHTML=changeModalItemHtml(c);
    $('#changeListModal').classList.add('open');
  }

  function renderReportPicker(){
    const menu=$('#reportPickerMenu');
    if(!menu)return;
    const keys=Object.keys(REPORTS);
    menu.innerHTML=keys.map(key=>{
      const r=REPORTS[key];
      const active=r.side===activeReportSide?' active':'';
      return `<div class="reportPickerItem${active}" data-side="${escAttr(r.side)}"><div class="pickTag">${esc(r.tag)}</div><div class="pickName">${esc(r.name)}</div></div>`;
    }).join('');
    menu.querySelectorAll('.reportPickerItem').forEach(item=>{
      item.addEventListener('click',()=>{
        selectReportSide(item.dataset.side);
        menu.classList.remove('open');
        $('#reportPickerChev').textContent='▼';
        $('#reportPickerBtn').setAttribute('aria-expanded','false');
      });
    });
  }

  function selectReportSide(side){
    if(!REPORTS[side])return;
    activeReportSide=side;
    const r=REPORTS[side];
    $('#reportPickerTag').textContent=r.tag;
    $('#reportPickerName').textContent=r.name;
    $('#reportPickerMeta').textContent=(r.modified||'—')+' · '+(r.pages||0)+' pages';
    renderReportPicker();
    updateReviewStats();
    renderReviewStream();
  }

  function reviewIndexHeadingHtml(r){
    if(!r.indexLabel&&!r.indexTitle){
      const side=activeReportSide;
      const rv=r.raw||r;
      const {label,title}=indexHeadingForReview(rv,side);
      if(!label&&!title)return '';
      if(!title||label===title)return '<span class="indexLabel">'+esc(label||title)+'</span>';
      return '<span class="indexLabel">'+esc(label)+'</span> · <span class="indexTitle">'+esc(title)+'</span>';
    }
    if(!r.indexTitle||r.indexLabel===r.indexTitle)return '<span class="indexLabel">'+esc(r.indexLabel||r.indexTitle)+'</span>';
    return '<span class="indexLabel">'+esc(r.indexLabel)+'</span> · <span class="indexTitle">'+esc(r.indexTitle)+'</span>';
  }
  function reviewOriginBadge(r){
    if(!r.origin)return '';
    const label=r.origin==='forward'?'forward':'new';
    return `<span class="rvBadge ${label}">${label}</span>`;
  }
  function reviewStatusBadge(r){
    const label=r.status==='cleared'?'cleared':'open';
    return `<span class="rvBadge ${label}">${label}</span>`;
  }
  function reviewAreaMetaHtml(r){
    const head=reviewIndexHeadingHtml(r);
    if(!head)return '';
    return '<span class="changeArea">'+head+'</span>';
  }
  function reviewMetaHtml(r){
    const parts=[];
    const origin=reviewOriginBadge(r);
    if(origin)parts.push(origin);
    parts.push(reviewStatusBadge(r));
    const area=reviewAreaMetaHtml(r);
    if(area)parts.push('<span class="metaSep">·</span>'+area);
    return parts.join('');
  }

  function filterReviewsByOrigin(items){
    if(!activeOriginNew&&!activeOriginForward)return items;
    return items.filter(r=>(activeOriginNew&&r.origin==='new')||(activeOriginForward&&r.origin==='forward'));
  }
  function updateOriginFilterUi(){
    document.querySelectorAll('#reviewOriginBar .originFilter').forEach(btn=>{
      const kind=btn.dataset.origin;
      btn.classList.remove('active');
      if(kind==='all'&&!activeOriginNew&&!activeOriginForward)btn.classList.add('active');
      if(kind==='new'&&activeOriginNew)btn.classList.add('active');
      if(kind==='forward'&&activeOriginForward)btn.classList.add('active');
    });
  }
  function updateReviewStats(){
    const bucket=reviewBucketForSide(activeReportSide);
    const stats=document.querySelectorAll('#reviewStatsRow .reviewStat');
    if(stats[0])stats[0].querySelector('.n').textContent=String(bucket.total.length);
    if(stats[1])stats[1].querySelector('.n').textContent=String(bucket.cleared.length);
    if(stats[2])stats[2].querySelector('.n').textContent=String(bucket.open.length);
    stats.forEach(btn=>btn.classList.toggle('active',btn.dataset.filter===activeStatusFilter));
  }

  function renderReviewStream(){
    const body=$('#reviewStreamBody');
    $('#reviewStream').classList.add('show');
    updateOriginFilterUi();
    updateReviewStats();
    const bucket=reviewBucketForSide(activeReportSide);
    const baseItems=bucket[activeStatusFilter]||bucket.total||[];
    const items=filterReviewsByOrigin(baseItems);
    if(!items.length){body.innerHTML='<div style="padding:12px;color:#94a3b8">No comments match.</div>';return}
    body.innerHTML=items.map(r=>{
      const ai=renderReviewAiBlock(r.aiItem||aiItemForReview(r.id),'streamAi');
      const clearedCls=r.status==='cleared'?' cleared':'';
      return `<div class="streamItem${clearedCls}" data-review-id="${escAttr(r.id)}"><div class="streamMain"><div class="streamMeta">${reviewMetaHtml(r)}</div><div class="streamSummary">${esc(trim(r.text))}</div></div>${ai}</div>`;
    }).join('');
    body.querySelectorAll('.streamItem').forEach(el=>{
      el.addEventListener('click',()=>{
        const r=items.find(x=>x.id===el.dataset.reviewId);
        if(r)openReviewModal(r);
      });
    });
  }

  function openReviewModal(r){
    $('#reviewModalTitle').textContent='Comment';
    const aiItem=r.aiItem||aiItemForReview(r.id);
    $('#reviewModalBody').innerHTML=
      `<div class="streamMeta">${reviewMetaHtml(r)}</div><p>${esc(r.text)}</p>`+
      renderReviewAiBlock(aiItem,'reviewModalAi')+
      `<div style="margin-top:8px"><a href="${viewerLink({tab:'review',review:r.id})}">Open in viewer</a></div>`;
    $('#reviewDetailModal').classList.add('open');
  }

  function resizeWorkspaceRenameInput(input){
    const v=String(input?.value||'').trim()||'Workspace';
    input.style.width=Math.min(24,Math.max(8,v.length+1))+'ch';
  }
  async function finishWorkspaceRename(commit=true){
    if(!WORKSPACE_RENAME_INPUT||!WORKSPACE_RENAME_ORIGINAL)return;
    const input=WORKSPACE_RENAME_INPUT;
    if(commit){
      const next=String(input.value||'').trim();
      if(next&&DOC_ID){
        const res=await fetch(`/api/file-manager/${DOC_ID}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:next})});
        const data=await res.json();
        if(!res.ok){toast(data.error==='duplicate title'?'Name already exists':(data.error||'Rename failed'));input.replaceWith(WORKSPACE_RENAME_ORIGINAL);WORKSPACE_RENAME_INPUT=null;WORKSPACE_RENAME_ORIGINAL=null;return}
        WORKSPACE_TITLE=next;
        toast('Renamed');
      }else if(next){WORKSPACE_TITLE=next}
    }
    input.replaceWith(WORKSPACE_RENAME_ORIGINAL);
    WORKSPACE_RENAME_INPUT=null;WORKSPACE_RENAME_ORIGINAL=null;
    updateWorkspaceTitle();
  }
  function startWorkspaceRename(){
    if(!DOC_ID){toast('Open a workspace first.');return}
    if(WORKSPACE_RENAME_INPUT){finishWorkspaceRename(true);return}
    const titleEl=$('#workspaceTitle');if(!titleEl)return;
    const input=document.createElement('input');
    input.type='text';input.className='sideTitleInput';input.value=WORKSPACE_TITLE||'Workspace';
    WORKSPACE_RENAME_INPUT=input;WORKSPACE_RENAME_ORIGINAL=titleEl;
    resizeWorkspaceRenameInput(input);
    titleEl.replaceWith(input);input.focus();input.select();
    input.addEventListener('input',()=>resizeWorkspaceRenameInput(input));
    input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();finishWorkspaceRename(true)}else if(e.key==='Escape'){e.preventDefault();finishWorkspaceRename(false)}});
  }

  FileManager.init({
    getCtx:()=>({docId:DOC_ID,workspaceTitle:WORKSPACE_TITLE}),
    onOpenWorkspace:async docId=>{FileManager.close();try{await openWorkspace(docId,null)}catch(e){toast('Failed to open workspace')}},
    onRenamed:async (docId,title)=>{if(DOC_ID===docId){WORKSPACE_TITLE=title;updateWorkspaceTitle()}},
    onDeleted:async docId=>{
      if(DOC_ID!==docId)return;
      try{
        const ws=await ensureDefaultWorkspace();
        await openWorkspace(ws.workspace_id,null);
      }catch(e){DOC_ID=null;updateFilesBtnLabel(null);updateWorkspaceTitle();renderEmptyDashboard();renderSessionList()}
    },
  });
  updateFilesBtnLabel(null);

  $('#sidebarCollapseBtn').addEventListener('click',()=>document.body.classList.add('sidebarCollapsed'));
  $('#sidebarRail').addEventListener('click',()=>document.body.classList.remove('sidebarCollapsed'));
  $('#workspaceHomeBtn').addEventListener('click',()=>{if(!DOC_ID){toast('Open a workspace first.');return}location.href=backToViewerLink()});
  $('#workspaceAnalysisBtn').addEventListener('click',()=>{if(!DOC_ID){toast('Open a workspace first.');return}location.href=backToViewerLink()});
  $('#workspaceFilesBtn').addEventListener('click',()=>FileManager.open('manage'));
  $('#workspaceRenameBtn').addEventListener('click',startWorkspaceRename);
  document.addEventListener('mousedown',e=>{if(WORKSPACE_RENAME_INPUT&&!e.target.closest('#workspaceRenameBtn')&&e.target!==WORKSPACE_RENAME_INPUT)finishWorkspaceRename(true)});
  $('#riskGrid').addEventListener('click',e=>{
    const card=e.target.closest('.riskCard');if(!card)return;
    activeRisk=activeRisk===card.dataset.risk?null:card.dataset.risk;
    renderChangeStream();
  });
  $('#reportPickerBtn').addEventListener('click',()=>{
    const menu=$('#reportPickerMenu'),open=menu.classList.toggle('open');
    $('#reportPickerChev').textContent=open?'▲':'▼';
    $('#reportPickerBtn').setAttribute('aria-expanded',open?'true':'false');
  });
  document.addEventListener('click',e=>{
    const menu=$('#reportPickerMenu');if(!menu.classList.contains('open'))return;
    if(!e.target.closest('.reportPicker')){menu.classList.remove('open');$('#reportPickerChev').textContent='▼';$('#reportPickerBtn').setAttribute('aria-expanded','false')}
  });
  $('#reviewStatsRow').addEventListener('click',e=>{
    const btn=e.target.closest('.reviewStat');if(!btn?.dataset.filter)return;
    activeStatusFilter=btn.dataset.filter;renderReviewStream();
  });
  document.querySelectorAll('#reviewOriginBar .originFilter').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const kind=btn.dataset.origin;
      if(kind==='all'){activeOriginNew=false;activeOriginForward=false}
      else if(kind==='new')activeOriginNew=!activeOriginNew;
      else if(kind==='forward')activeOriginForward=!activeOriginForward;
      renderReviewStream();
    });
  });
  ['changeModalClose','changeListModal'].forEach(id=>{
    const el=$(id==='changeListModal'?'#changeListModal':'#'+id);
    if(!el)return;
    if(id==='changeListModal')el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open')});
    else el.addEventListener('click',()=>$('#changeListModal').classList.remove('open'));
  });
  ['reviewListModalClose','reviewListModal','reviewModalClose','reviewDetailModal'].forEach(id=>{
    const el=$('#'+id);if(!el)return;
    if(id.includes('Modal')&&id!=='reviewModalClose')el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open')});
    else if(id==='reviewModalClose')el.addEventListener('click',()=>$('#reviewDetailModal').classList.remove('open'));
    else if(id==='reviewListModalClose')el.addEventListener('click',()=>$('#reviewListModal').classList.remove('open'));
  });

  async function bootstrap(){
    const params=new URLSearchParams(location.search);
    const docId=params.get('doc');
    ORIGIN_RUN_ID=params.get('run')||null;
    async function openDefaultWorkspace(){
      const ws=await ensureDefaultWorkspace();
      await openWorkspace(ws.workspace_id,null);
    }
    if(docId){
      try{await openWorkspace(docId,params.get('snapshot')||null)}
      catch(e){
        try{await openDefaultWorkspace()}catch(_){toast('Failed to load workspace')}
      }
      return;
    }
    try{await openDefaultWorkspace()}catch(e){}
  }
  bootstrap();
})();
</script>
</body>
</html>
